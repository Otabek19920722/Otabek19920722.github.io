<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube Tahlil</title>
<meta name="description" content="YouTube Tahlil — o'z kanallaringiz va raqiblaringiz uchun bepul tahlil studiyasi">
<meta name="theme-color" content="#EE4F2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — fixed left rail with tools, sticky top bar, content column that always puts the verdict (score, tips) before the evidence (charts, tables) */
:root{
  --bg:#F1F2F6; --surface:#FFFFFF; --surface-2:#F7F8FB; --surface-3:#E9ECF2;
  --ink:#12141C; --ink-2:#3D4354; --muted:#717889; --line:#E1E4EB; --line-2:#CFD4DE;
  --accent:#EE4F2A; --accent-2:#D9411E; --accent-ink:#FFFFFF; --accent-soft:#FDE5DD;
  --d1:#0B93A7; --d2:#6A52F2; --d3:#C98A06; --d4:#1F9D63;
  --hot:#DF4220; --hot-bg:#FCE3DA; --warm:#A86F06; --warm-bg:#FAEFCF;
  --good:#16834F; --good-bg:#DCF2E6; --bad:#C3332C; --bad-bg:#FBE1DF;
  --shadow:0 1px 2px rgba(18,20,28,.05),0 6px 20px -8px rgba(18,20,28,.10);
  --shadow-lg:0 2px 4px rgba(18,20,28,.05),0 18px 40px -12px rgba(18,20,28,.18);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:16px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0D15; --surface:#16151F; --surface-2:#1C1B27; --surface-3:#262433;
  --ink:#EFEEF6; --ink-2:#C6C4D4; --muted:#8F8CA4; --line:#2A2839; --line-2:#3A3850;
  --accent:#FF6B47; --accent-2:#FF8566; --accent-ink:#1A0F0B; --accent-soft:#3A1C14;
  --d1:#3CC8D8; --d2:#9D8BFF; --d3:#F2B33D; --d4:#3DD68C;
  --hot:#FF7B57; --hot-bg:#3B1C13; --warm:#F2B33D; --warm-bg:#332610;
  --good:#3DD68C; --good-bg:#11301F; --bad:#FF6B6B; --bad-bg:#3A1617;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 24px 48px -16px rgba(0,0,0,.6);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E0D15; --surface:#16151F; --surface-2:#1C1B27; --surface-3:#262433;
  --ink:#EFEEF6; --ink-2:#C6C4D4; --muted:#8F8CA4; --line:#2A2839; --line-2:#3A3850;
  --accent:#FF6B47; --accent-2:#FF8566; --accent-ink:#1A0F0B; --accent-soft:#3A1C14;
  --d1:#3CC8D8; --d2:#9D8BFF; --d3:#F2B33D; --d4:#3DD68C;
  --hot:#FF7B57; --hot-bg:#3B1C13; --warm:#F2B33D; --warm-bg:#332610;
  --good:#3DD68C; --good-bg:#11301F; --bad:#FF6B6B; --bad-bg:#3A1617;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.35),0 24px 48px -16px rgba(0,0,0,.6);
  color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:22px 14px 18px;background:var(--surface);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px;padding:0 8px;text-decoration:none;color:var(--ink)}
.logo-mark{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.logo b{font:800 18px/1 var(--f-display);letter-spacing:-.02em;display:block}
.logo small{font-size:11.5px;color:var(--muted);display:block;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14.5px;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav a[aria-current=page] .ic{color:var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 6px}
.qmeter{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}
.qmeter .t{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
.qmeter .t b{font:600 13px var(--f-mono);color:var(--ink)}
.qbar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.qbar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--d4),var(--d1));transition:width .4s}
.qbar.warn i{background:linear-gradient(90deg,var(--d3),var(--hot))}
.qmeter p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.4}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:14px;padding-block:14px;padding-inline:32px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.topbar h1{margin:0;font:700 21px/1.15 var(--f-display);letter-spacing:-.015em}
.topbar p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.topbar .tt{min-width:0;flex:1}
.top-actions{display:flex;align-items:center;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)}
.content{padding-inline:32px;padding-block:24px 70px;display:flex;flex-direction:column;gap:22px;max-width:1320px;width:100%}
.view{display:flex;flex-direction:column;gap:22px}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .logo small,.logo b,.nav-group,.rail-foot{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav a{white-space:nowrap;padding:8px 11px;font-size:13.5px}
  .topbar{position:static;padding-inline:16px}
  .content{padding-inline:16px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 260px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap;transition:transform .08s,background .15s;text-decoration:none}
.btn:hover{background:var(--accent-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.sec{background:var(--surface-3);color:var(--ink)}
.btn.sec:hover{background:var(--line-2)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.line:hover{background:var(--surface-2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.inp,select.inp,textarea.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-width:0;transition:border-color .15s,background .15s}
.inp:focus{border-color:var(--accent);background:var(--surface);outline:none}
select.inp{padding-right:30px}
.inp-num{width:100px}
.formbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.pill{text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warm-bg);color:var(--warm)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0}
/* Mening kanallarim */
.mine-card{padding:0;overflow:hidden;border:2px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.mine-toggle{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:18px 20px;cursor:pointer;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.mine-toggle:hover{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.mine-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mine-toggle .ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.mine-toggle .tt{flex:1;min-width:0}
.mine-toggle .tt b{display:block;font:800 17px/1.2 var(--f-display)}
.mine-toggle .tt small{color:var(--muted);font-size:13px}
.mine-toggle .mine-n{min-width:28px;height:28px;padding:0 8px;border-radius:99px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.mine-toggle .ic{transition:transform .2s}
.mine-toggle[aria-expanded="true"] .ic:last-child{transform:rotate(180deg)}
.mine-body{padding:18px 20px 20px;border-top:1px solid var(--line)}
.mine-body .li .acts{display:flex;gap:6px;align-items:center;flex:none}
.mine-body .iconbtn{width:32px;height:32px}
.mine-body .iconbtn:disabled{opacity:.35;cursor:default}
.mine-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mine-chip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font:inherit;color:var(--ink);font-weight:600;font-size:14px}
.mine-chip:hover{background:var(--surface-2)}
.mine-chip .ava.xs{margin:0}
.mine-chip.add{border-style:dashed;color:var(--accent);padding-left:12px}
@media (max-width:560px){.mine-toggle{padding:14px 16px;gap:10px}.mine-body{padding:14px 16px 16px}.mine-body .li{flex-wrap:wrap}.mine-body .li .acts{width:100%;padding-left:52px}}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 11px;border-radius:99px;background:var(--surface-3);color:var(--ink-2);border:0;cursor:default;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip b{font:600 11px var(--f-mono);color:var(--muted)}
button.chip{cursor:pointer}
button.chip:hover{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font:700 19px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.sec-h p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.card h3{margin:0;font:700 16px/1.25 var(--f-display);letter-spacing:-.005em}
.card h3+p{margin:4px 0 0;font-size:13px;color:var(--muted)}

.status{font-size:14px;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status.info{background:var(--surface-3);color:var(--ink-2)}
.status.error{background:var(--bad-bg);color:var(--bad);font-weight:600}
.status.loading{background:var(--surface-3);color:var(--ink-2)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{border-radius:var(--r);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:300% 100%;animation:sk 1.4s ease-in-out infinite;border:1px solid var(--line)}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}

.banner-note{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--warm-bg);color:var(--warm);font-weight:600;font-size:14px;flex-wrap:wrap}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px}
.kpi .v{font:600 24px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted);line-height:1.4}
.kpi .spark{margin-top:4px}
.delta{font:600 12px var(--f-mono);padding:2px 7px;border-radius:6px}
.delta.up{background:var(--good-bg);color:var(--good)}
.delta.down{background:var(--bad-bg);color:var(--bad)}
.delta.flat{background:var(--surface-3);color:var(--muted)}

/* ---------- channel hero ---------- */
.chero{overflow:hidden}
.chero .bnr{height:150px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 55%,var(--d2)),color-mix(in srgb,var(--d1) 70%,var(--surface)));position:relative}
.chero .bnr img{width:100%;height:100%;object-fit:cover;display:block}
.chero .body{display:flex;gap:20px;padding:0 24px 22px;flex-wrap:wrap;align-items:flex-end}
.ava{position:relative;z-index:1;width:96px;height:96px;border-radius:50%;flex:none;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 36px var(--f-display);overflow:hidden;border:4px solid var(--surface);margin-top:-44px;box-shadow:var(--shadow)}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.sm{width:40px;height:40px;font-size:16px;border-width:0;margin:0;box-shadow:none}
.ava.xs{width:28px;height:28px;font-size:12px;border-width:0;margin:0;box-shadow:none}
.chero .who{flex:1 1 280px;min-width:0;padding-top:14px}
.chero h2{margin:0;font:800 28px/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.chero h2 a{color:inherit;text-decoration:none}
.chero .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13.5px;margin-top:6px}
.chero .desc{margin:10px 0 0;color:var(--ink-2);font-size:13.5px;max-width:72ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.chero .desc.open{-webkit-line-clamp:unset;display:block}
.chero .acts{display:flex;gap:8px;flex-wrap:wrap}
.how{border-top:1px dashed var(--line);padding-top:10px}
.how summary{cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--muted);list-style:none}
.how summary::-webkit-details-marker{display:none}
.how[open] summary,.how summary:hover{color:var(--ink)}
.how-b{margin-top:8px;display:flex;flex-direction:column}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);background:var(--surface-2)}
.hstats>div{padding:14px 24px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.hstats>div:last-child{border-right:0}
.hstats small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.hstats b{font:600 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- score ring ---------- */
.scorecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.ring{position:relative;width:148px;height:148px;flex:none}
.ring svg{display:block}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font-family:var(--f-display);font-weight:800;line-height:1;letter-spacing:-.03em;display:block}
.ring .num small{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-top:4px}
.subbars{display:flex;flex-direction:column;gap:11px;min-width:0}
.sb .t{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600}
.sb .t span:last-child{font-family:var(--f-mono);color:var(--muted);font-weight:500}
.sb .tr{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.sb .tr i{display:block;height:100%;border-radius:4px}
.sb small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
@media (max-width:560px){.scorecard{grid-template-columns:1fr;justify-items:center}.subbars{width:100%}}

/* ---------- tips ---------- */
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tip{display:flex;gap:12px;padding:14px 16px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);align-items:flex-start}
.tip .ti{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.tip.good .ti{background:var(--good-bg);color:var(--good)}
.tip.warn .ti{background:var(--warm-bg);color:var(--warm)}
.tip.bad .ti{background:var(--bad-bg);color:var(--bad)}
.tip.info .ti{background:var(--accent-soft);color:var(--accent)}
.tip p{margin:0;font-size:14px;line-height:1.45}
.tip p b{font-weight:700}

/* ---------- video cards ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.vc{display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:transform .15s,box-shadow .15s}
.vc:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.vc .th{display:block;aspect-ratio:16/9;max-width:100%;background:linear-gradient(135deg,var(--surface-3),color-mix(in srgb,var(--d2) 18%,var(--surface-3)));position:relative;overflow:hidden}
.vc .th img{width:100%;height:100%;object-fit:cover;display:block}
.vc .th .tl{position:absolute;left:9px;top:9px;display:flex;gap:6px}
.vc .th .dur{position:absolute;right:8px;bottom:8px;background:rgba(10,10,14,.82);color:#fff;font:600 11.5px var(--f-mono);padding:2px 6px;border-radius:5px}
.vc .th .rank{background:rgba(10,10,14,.82);color:#fff;font:700 12px var(--f-mono);padding:3px 8px;border-radius:6px}
.vc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.vc .t{font-weight:600;font-size:14.5px;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);text-decoration:none}
.vc a.t:hover{color:var(--accent)}
.vc .m{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.vc .m>span{white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.vc .m .mono{color:var(--ink-2)}
.vc .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.vc .chn{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.score{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--f-mono);padding:3px 8px;border-radius:99px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.vc .th .score{background:rgba(10,10,14,.78);color:#fff}
.score.hot{background:var(--hot-bg);color:var(--hot)}
.score.warm{background:var(--warm-bg);color:var(--warm)}
.score.low{color:var(--bad)}
.vc .th .score.hot{background:var(--hot);color:#fff}
.vc .th .score.warm{background:var(--d3);color:#1a1205}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;padding:2px 0;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;min-width:0}
.chart svg{display:block;overflow:visible}
.chart text{fill:var(--muted);font:500 11px var(--f-mono)}
.chart text.halo{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round;fill:var(--ink-2);font-weight:600}
.ideas-deep{max-height:300px;overflow:auto;padding-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.ln{width:16px;height:3px;border-radius:2px}
#tip{position:fixed;z-index:100;pointer-events:none;max-width:300px;background:var(--ink);color:var(--bg);padding:9px 11px;border-radius:10px;font-size:12.5px;line-height:1.4;box-shadow:var(--shadow-lg)}
#tip b{display:block;font-weight:700;margin-bottom:3px}
#tip .mono{color:inherit;opacity:.85}

.heat{display:grid;grid-template-columns:34px repeat(6,minmax(0,1fr));gap:4px;font-size:11.5px}
.heat .hd{color:var(--muted);text-align:center;font:500 10.5px var(--f-mono);padding-bottom:2px}
.heat .rl{color:var(--muted);font-weight:700;display:flex;align-items:center}
.heat .c{aspect-ratio:1.7;border-radius:7px;display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--ink-2);background:var(--surface-3);min-height:28px;cursor:default}
.heat .c.best{outline:2px solid var(--accent);outline-offset:1px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:110px minmax(0,1fr) 74px;gap:10px;align-items:center;font-size:13px}
.hb .l{font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .l small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.hb .tr{height:22px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px;background:var(--d1)}
.hb.top .tr i{background:var(--accent)}
.hb .v{font:600 12.5px var(--f-mono);text-align:right}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.cols .cl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.cols .cl i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--d2);min-height:3px;position:relative}
.cols .cl em{font:600 11px var(--f-mono);font-style:normal;color:var(--ink-2)}
.cols .cl small{font-size:11px;color:var(--muted);white-space:nowrap}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.two.eq{align-items:stretch}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.feat{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;padding:8px 0;border-bottom:1px dashed var(--line)}
.fr:last-child{border-bottom:0}
.fr small{display:block;color:var(--muted);font-size:12px}

/* ---------- table ---------- */
.dt-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.dt-search{max-width:320px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;background:var(--surface-2);font-weight:700}
th:hover{color:var(--ink)}
th.num,td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th[data-dir=asc]::after{content:" ↑";color:var(--accent)} th[data-dir=desc]::after{content:" ↓";color:var(--accent)}
tbody tr:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.vt{min-width:320px}
table.compact{min-width:0}
table.compact th,table.compact td{padding:9px 10px}
td.vt .in{display:flex;gap:12px;align-items:center}
td.vt img,td.vt .ph{width:104px;aspect-ratio:16/9;border-radius:7px;object-fit:cover;flex:none;background:var(--surface-3)}
td.vt a,td.vt span.tt{color:var(--ink);text-decoration:none;font-weight:600;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td.vt a:hover{color:var(--accent)}
td .sub{font-size:12px;color:var(--muted)}
.more{display:flex;justify-content:center;margin-top:12px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ei{width:52px;height:52px;border-radius:14px;background:var(--surface-3);display:grid;place-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:15px}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;padding:34px 34px 30px;background:
  radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),
  radial-gradient(500px 240px at 0% 100%,color-mix(in srgb,var(--d1) 14%,transparent),transparent 70%),var(--surface)}
.hero h2{margin:0;font:800 clamp(28px,4vw,42px)/1.05 var(--f-display);letter-spacing:-.03em;text-wrap:balance;max-width:20ch}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{margin:10px 0 0;color:var(--ink-2);max-width:60ch}
.omni{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;max-width:760px}
.omni .inp{flex:1 1 300px;padding:15px 16px;font-size:16px;border-radius:13px;background:var(--surface)}
.omni .btn{padding:15px 22px;border-radius:13px}
.detect{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.detect span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--surface-3);color:var(--muted);font-weight:600;transition:all .15s}
.detect span.on{background:var(--accent);color:var(--accent-ink)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:10px;padding:18px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
.tool:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.tool .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.tool b{font:700 16px var(--f-display)}
.tool p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}
.tool .cost{margin-top:auto;font:600 11.5px var(--f-mono);color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:st}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font:700 13px var(--f-mono);flex:none}
.step.done .n{background:var(--good);color:#fff}
.step p{margin:0;font-size:13.5px}
.step p b{display:block;font-size:14px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{color:var(--muted);font-size:12.5px}

/* ---------- compare ---------- */
.cmp th.ch,.cmp td{min-width:150px}
.cmp td.metric{font-weight:600;min-width:180px;font-family:var(--f-body)}
.cmp td.metric small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.cmpcell{display:flex;flex-direction:column;gap:5px}
.cmpcell .tr{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.cmpcell .tr i{display:block;height:100%;border-radius:3px}
.cmpcell.win b{color:var(--good)}
.cmpcell b{font:600 14px var(--f-mono)}
.chhead{display:flex;align-items:center;gap:9px}
.chhead span{font:700 13.5px var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* ---------- gauge ---------- */
.gauge-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:560px){.gauge-wrap{grid-template-columns:1fr;justify-items:center}}

/* ---------- video detail ---------- */
.vhero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.vhero{grid-template-columns:1fr}}
.vthumb{aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--surface-3);position:relative}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .vplay{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;border:0;background:rgba(10,10,14,.72);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s}
.vthumb .vplay:hover{transform:scale(1.06);background:var(--accent)}
.vthumb .dur{position:absolute;right:12px;bottom:12px;background:rgba(10,10,14,.85);color:#fff;font:600 13px var(--f-mono);padding:3px 8px;border-radius:6px}
.vtitle{margin:0;font:700 22px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.descbox{white-space:pre-wrap;font-size:13.5px;color:var(--ink-2);max-height:220px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0;font-family:var(--f-body);overflow-wrap:anywhere}
.cmt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.cmt .tx{min-width:0;flex:1}
.cmt .tx b{font-size:13px}
.cmt .tx p{margin:3px 0 0;font-size:14px;overflow-wrap:anywhere;white-space:pre-line}
.cmt .lk{font:600 12px var(--f-mono);color:var(--muted);white-space:nowrap}

/* ---------- preview mock ---------- */
.pv-wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.pv-wrap{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{max-width:100%;border-radius:10px;aspect-ratio:16/9;object-fit:cover}
.counter{font:600 12px var(--f-mono);color:var(--muted);text-align:right}
.counter.bad{color:var(--bad)}
.yt{border-radius:var(--r);padding:20px;font-family:Roboto,"Segoe UI",Arial,sans-serif;overflow:hidden}
.yt.l{background:#ffffff;color:#0f0f0f}
.yt.d{background:#0f0f0f;color:#f1f1f1}
.yt .g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 14px}
.yt.m .g{grid-template-columns:minmax(0,1fr);max-width:400px;margin:0 auto;gap:18px}
.yt .c{min-width:0;border-radius:14px;transition:box-shadow .2s}
.yt .c.me{box-shadow:0 0 0 3px var(--accent);padding:6px;margin:-6px}
.yt .c .im{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#d9d9d9;position:relative}
.yt.d .c .im{background:#272727}
.yt.m .c .im{border-radius:0}
.yt .c .im img{width:100%;height:100%;object-fit:cover;display:block}
.yt .c .im .dr{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:1px 5px;border-radius:4px}
.yt .c .rw{display:flex;gap:12px;margin-top:12px}
.yt .c .av{width:36px;height:36px;border-radius:50%;flex:none;background:#c4c4c4;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;overflow:hidden}
.yt .c .av img{width:100%;height:100%;object-fit:cover}
.yt .c .tt{font-size:16px;font-weight:500;line-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.yt.m .c .tt{font-size:14px;line-height:20px}
.yt .c .mt{font-size:14px;color:#606060;margin-top:4px;line-height:20px}
.yt.d .c .mt{color:#aaa}
.yt.m .c .mt{font-size:12px;line-height:18px}
@media (max-width:700px){.yt .g{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:7px 0}
.ck .m{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.ck.y .m{background:var(--good-bg);color:var(--good)}
.ck.n .m{background:var(--bad-bg);color:var(--bad)}
.ck.o .m{background:var(--surface-3);color:var(--muted)}
.ck small{display:block;color:var(--muted);font-size:12px}

/* ---------- tracker ---------- */
.trk td .chhead span{max-width:220px}

/* ---------- toasts ---------- */
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:center;animation:tin .25s ease-out}
.toast.err{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

.kbd{font:600 11px var(--f-mono);padding:2px 6px;border-radius:5px;background:var(--surface-3);color:var(--ink-2)}
.costtbl{width:100%;min-width:0;font-size:13.5px}
.costtbl td{padding:8px 4px;border-bottom:1px dashed var(--line)}
.costtbl td:last-child{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.costtbl tr:hover td{background:none}

/* ---------- in-app player: one click on any video card plays it here ---------- */
.vc .th .pi{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(10,10,14,.72);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.85);transition:opacity .15s,transform .15s;pointer-events:none}
.vc .th:hover .pi,.vc .th:focus-visible .pi{opacity:1;transform:scale(1)}
@media (hover:none){.vc .th .pi{opacity:.9;transform:none;width:44px;height:44px;margin:-22px 0 0 -22px}}
.pl-ov{position:fixed;inset:0;z-index:200;background:rgba(6,6,10,.8);display:grid;place-items:center;padding:20px;animation:tin .2s ease-out}
.pl-box{width:min(1040px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.pl-hd{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 18px;border-bottom:1px solid var(--line)}
.pl-hd .hint{font-family:var(--f-mono)}
.pl-stage{background:#000;display:flex;justify-content:center}
.pl-fr{position:relative;width:100%;aspect-ratio:16/9}
.pl-fr.short{width:auto;height:min(70vh,640px);max-width:100%;aspect-ratio:9/16}
.pl-fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pl-bd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.pl-bd h3{margin:0;font:700 18px/1.3 var(--f-display);letter-spacing:-.01em}
.pl-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px;color:var(--muted)}
.pl-meta b{color:var(--ink);font-weight:600}
.pl-meta>span{white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
@media (max-width:560px){.pl-ov{padding:0;place-items:stretch}.pl-box{max-height:100vh;border-radius:0}.pl-bd .row .btn{flex:1 1 auto}}

/* ---------- o'xshash kanallar ---------- */
#oxshash{scroll-margin-top:90px}
.sim-card{border:2px solid color-mix(in srgb,var(--d2) 40%,var(--line))}
.sim-kw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sim-kw .chip.kw{background:color-mix(in srgb,var(--d2) 14%,var(--surface));color:var(--d2);font-weight:700}
.simch{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.sc{display:flex;flex-direction:column;gap:10px;padding:14px;min-width:0}
.sc.pin{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.sc .top{display:flex;gap:12px;align-items:center;min-width:0}
.sc .top .tx{flex:1;min-width:0}
.sc .top b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .top small{color:var(--muted);font-size:12.5px}
.sc .st{display:flex;flex-wrap:wrap;gap:6px}
.sc .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.sc .acts .btn{padding:6px 10px}
.sc .sc-x{width:30px;height:30px;flex:none;align-self:flex-start;border-color:transparent;background:transparent;color:var(--muted)}
.sc .sc-x:hover{background:var(--bad-bg);color:var(--bad)}
.sc .bestv{display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.35;min-width:0;cursor:pointer;background:var(--surface-2);border-radius:10px;padding:6px;border:1px solid var(--line);text-align:left;width:100%;color:inherit}
.sc .bestv:hover{border-color:var(--line-2)}
.sc .bestv img,.sc .bestv .ph{width:88px;aspect-ratio:16/9;border-radius:6px;object-fit:cover;flex:none;background:var(--surface-3)}
.sc .bestv span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.sim-sub{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sim-sub h3{margin:0;font:700 17px/1.25 var(--f-display)}
.sim-sub p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.sim-start{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sim-start p{margin:0;flex:1 1 300px;color:var(--ink-2);font-size:14px}

/* ---------- kunlik hisobot ---------- */
.rep-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.rep-top h3{margin:0}
.rep-top p{margin:2px 0 0}
.rep-h{display:flex;align-items:center;gap:14px;min-width:0}
.rep-h .ava{width:52px;height:52px;font-size:20px;margin:0;border-width:0;box-shadow:none}
.rep-h .tx{flex:1;min-width:0}
.rep-h h3{margin:0;font:700 19px/1.25 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-h small{color:var(--muted);font-size:13px}
.rep-subs{text-align:right;flex:none}
.rep-subs b{display:block;font:800 26px/1 var(--f-display);letter-spacing:-.02em}
.rep-subs small{color:var(--muted);font-size:12px;font-weight:600}
.rep-k{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mk{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mk small{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk .mv{font-size:15px;min-height:24px;display:flex;align-items:center}
.mk .mv b{font-weight:700}
.mk .ms{font-size:12px;color:var(--muted)}
.rep-wait{display:flex;align-items:center;gap:8px;padding:14px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);font-size:13.5px}
.nvl{display:flex;flex-direction:column;gap:8px}
.nv{display:flex;align-items:center;gap:12px;min-width:0;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.nv-th{position:relative;width:112px;aspect-ratio:16/9;flex:none;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--surface-3);cursor:pointer}
.nv-th img{width:100%;height:100%;object-fit:cover;display:block}
.nv-th .dur{position:absolute;right:4px;bottom:4px;background:rgba(10,10,14,.82);color:#fff;font:600 10.5px var(--f-mono);padding:1px 5px;border-radius:4px}
.nv .tx{flex:1;min-width:0}
.nv .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:14px;line-height:1.35}
.nv .tx small{color:var(--muted);font-size:12.5px}
.nv .score{flex:none;margin-right:4px}
.sug{display:flex;flex-direction:column;gap:8px}
.sg{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.sg p{margin:0;flex:1;font-size:14px;line-height:1.45;min-width:0}
.sg .si{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.sg.good .si{background:var(--hot-bg);color:var(--hot)}
.sg.warn .si{background:var(--warm-bg);color:var(--warm)}
.sg.info .si{background:color-mix(in srgb,var(--d1) 14%,transparent);color:var(--d1)}
.sg .linkbtn{flex:none;align-self:center}
.hr-l{display:flex;flex-direction:column;gap:6px}
.hr{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface-2);min-width:0}
.hr:hover{border-color:var(--line-2)}
.hr .tx{flex:1;min-width:0}
.hr .tx b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .tx small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr-n{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
/* ---------- izohlar ---------- */
.cm{display:flex;gap:12px;padding:14px 16px;align-items:flex-start;min-width:0}
.cm.dim{opacity:.72}
.cm .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cm-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px}
.cm-h .hint{display:inline-flex;align-items:center;gap:3px}
.cm-t{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.5}
.cm-v{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:0;background:var(--surface-3);color:var(--ink-2);font-size:12.5px;padding:4px 9px;border-radius:8px;cursor:pointer;align-self:flex-start;text-align:left}
.cm-v span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cm-v:hover{color:var(--ink)}
.cm-a{display:flex;flex-wrap:wrap;gap:6px}
/* ---------- studio ---------- */
.wzl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.wz{display:flex;gap:12px;align-items:flex-start}
.wz .n{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px}
.wz b{display:block;margin-bottom:2px}
.wz p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.wz-code{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.wz-code code{font:600 13px var(--f-mono);background:var(--surface-3);padding:4px 8px;border-radius:6px;overflow-wrap:anywhere}
.mine-chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.mine-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.mine-chip .dot.ok{background:var(--good)}
.install-btn{display:none}
.seg.wrap{flex-wrap:wrap;max-width:100%}
.seg.wrap button{flex:0 1 auto}
.install-btn.on{display:inline-flex}
@media (max-width:560px){
  .rep-h .ava{width:42px;height:42px}
  .rep-h h3{font-size:17px}
  .rep-subs b{font-size:21px}
  .rep-k{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nv-th{width:92px}
  .cm{padding:12px}
  .cm-a .btn{flex:1 1 auto;justify-content:center}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- format ---------- */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function compact(n){
  if(n==null||!isFinite(n)) return '—';
  const a=Math.abs(n), f=(x,d)=>x.toFixed(d).replace(/\.0$/,'');
  if(a<1000) return String(Math.round(n));
  if(a<1e6) return f(n/1e3,a<1e4?1:0)+' ming';
  if(a<1e9) return f(n/1e6,a<1e7?1:0)+' mln';
  return f(n/1e9,1)+' mlrd';
}
function full(n){ return n==null||!isFinite(n)?'—':Math.round(n).toLocaleString('ru-RU'); }
function pct(x,d=1){ return x==null||!isFinite(x)?'—':(x*100).toFixed(d).replace(/\.0$/,'')+'%'; }
function money(x){ if(x==null||!isFinite(x)) return '—'; if(x<10) return '$'+x.toFixed(2).replace(/\.00$/,''); if(x<1000) return '$'+Math.round(x); return '$'+compact(x); }
const MON=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];
const WD=['Du','Se','Ch','Pa','Ju','Sh','Ya'];

function dateUz(d){ return d.getDate()+'-'+MON[d.getMonth()]+', '+d.getFullYear(); }
function ago(d){
  const hrs=(Date.now()-d)/36e5, days=hrs/24;
  if(hrs<1) return 'hozirgina';
  if(hrs<24) return Math.floor(hrs)+' soat oldin';
  if(days<30) return Math.floor(days)+' kun oldin';
  if(days<365) return Math.floor(days/30)+' oy oldin';
  return (days/365).toFixed(1).replace(/\.0$/,'')+' yil oldin';
}
function dur(s){
  if(!s) return '—';
  const hh=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60, p=x=>String(x).padStart(2,'0');
  return hh?`${hh}:${p(m)}:${p(sec)}`:`${m}:${p(sec)}`;
}
function parseDur(iso){
  const m=/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso||'');

}

/* ---------- quota ---------- */

/* limit AQSh Tinch okeani vaqti bilan yarim tunda yangilanadi: Koreyada qishda 17:00, yozda 16:00 */
function quotaReset(){
  const now=new Date();
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(now).map(x=>[x.type,x.value]));

  return new Date(Math.round((now.getTime()+(86400-sec)*1000)/60000)*60000);
}
function hhmm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  $('#qNote').textContent=`Sizning vaqtingiz bilan har kuni ${resetText()} da yangilanadi`;
}

/* ---------- toasts, tooltip, copy, download ---------- */
function toast(msg,tone){
  const t=h('div',{class:'toast'+(tone==='err'?' err':'')},icon(tone==='err'?'info':'check',16,2.2),msg);

const tipEl=()=>$('#tip');
function showTip(e,nodes){ const t=tipEl(); t.replaceChildren(...[nodes].flat()); t.hidden=false; moveTip(e); }
function moveTip(e){
  const t=tipEl(); if(t.hidden) return;
  const r=t.getBoundingClientRect();
  let x=e.clientX+14, y=e.clientY+16;
  if(x+r.width>innerWidth-8) x=e.clientX-r.width-14;
  if(y+r.height>innerHeight-8) y=e.clientY-r.height-14;
  t.style.left=Math.max(8,x)+'px'; t.style.top=Math.max(8,y)+'px';
}
function hideTip(){ tipEl().hidden=true; }
function tipOn(el,fn){
  el.addEventListener('mouseenter',e=>showTip(e,fn()));
  el.addEventListener('mousemove',moveTip);
  el.addEventListener('mouseleave',hideTip);
  return el;
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Nusxalandi'); }
  catch(e){
    const ta=h('textarea',{style:'position:fixed;left:-9999px'}); ta.value=text; document.body.append(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove(); toast(ok?'Nusxalandi':"Nusxalab bo'lmadi",ok?null:'err');
  }
}
function download(name,text,type){
  const url=URL.createObjectURL(new Blob([text],{type:type||'text/plain;charset=utf-8'}));
  const a=h('a',{href:url,download:name}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

/* ---------- API ---------- */
class AppErr extends Error{ constructor(msg,code){ super(msg); this.code=code; } }
const NO_KEY="Avval YouTube API kalitini kiriting — bu bepul va 10 daqiqa oladi.";
function errText(reason,msg){
  const r=(reason||'')+' '+(msg||'');
  if(/keyInvalid|API key not valid|API_KEY_INVALID/i.test(r)) return "API kalit noto'g'ri. Google Cloud'dan kalitni qaytadan nusxalab, Sozlamalarga kiriting.";
  if(/quotaExceeded|dailyLimitExceeded|rateLimitExceeded/i.test(r)) return `Bugungi bepul limit tugadi. Sizning vaqtingiz bilan ${resetText()} da yangilanadi.`;
  if(/accessNotConfigured|SERVICE_DISABLED|has not been used/i.test(r)) return "YouTube Data API v3 yoqilmagan. Google Cloud → APIs & Services → Library → YouTube Data API v3 → ENABLE.";
  if(/API_KEY_SERVICE_BLOCKED/i.test(r)) return "Kalit boshqa API uchun cheklangan. Kalit sozlamasida YouTube Data API v3 ni belgilang.";
  if(/REFERRER|referer/i.test(r)) return "Kalitda veb-sayt cheklovi bor. Google Cloud'da kalitning 'Application restrictions' bandini None qiling.";
  if(/commentsDisabled/i.test(r)) return "Bu videoda izohlar o'chirilgan.";
  if(/videoChartNotFound|notFound/i.test(r)) return "Bu mamlakat uchun bunday toifa topilmadi. Boshqa toifani tanlang.";
  return "YouTube xatosi: "+(msg||reason||"noma'lum");
}
const memCache=new Map();
const API_META={fresh:false,cachedAt:null};
function apiTTL(path,params){ if(path==='search') return 24*3600e3; if(params.chart) return 3600e3; if(path==='commentThreads') return 12*3600e3; return 6*3600e3; }
/* persistent cache (IndexedDB) — repeat analyses cost no quota */
let idbP=null;
function idb(){
  if(idbP) return idbP;
  idbP=new Promise(res=>{ try{ const r=indexedDB.open('ytt',1); r.onupgradeneeded=()=>r.result.createObjectStore('c',{keyPath:'k'}); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } });
  return idbP;
}
async function cacheGet(k){ const db=await idb(); if(!db) return null; return new Promise(res=>{ try{ const q=db.transaction('c').objectStore('c').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }catch(e){ res(null); } }); }
async function cachePut(k,j){ const db=await idb(); if(!db) return; try{ db.transaction('c','readwrite').objectStore('c').put({k,t:Date.now(),j}); }catch(e){} }
async function cachePrune(){ const db=await idb(); if(!db) return; try{ const q=db.transaction('c','readwrite').objectStore('c').openCursor(); q.onsuccess=()=>{ const c=q.result; if(!c) return; if(Date.now()-c.value.t>3*864e5) c.delete(); c.continue(); }; }catch(e){} }
async function cacheClear(){ memCache.clear(); const db=await idb(); if(!db) return; try{ db.transaction('c','readwrite').objectStore('c').clear(); }catch(e){} }
async function withApi(fresh,fn){ API_META.fresh=!!fresh; API_META.cachedAt=null; try{ return await fn(); } finally{ API_META.fresh=false; } }
async function api(path,params,cost,opt){
  opt=opt||{};
  if(!S.key) throw new AppErr(NO_KEY,'nokey');
  const u=new URL('https://www.googleapis.com/youtube/v3/'+path);
  for(const [k,v] of Object.entries(params)) if(v!==undefined&&v!==null&&v!=='') u.searchParams.set(k,v);
  const ck=u.toString(), ttl=apiTTL(path,params);
  if(!(opt.fresh||API_META.fresh)){
    let hit=memCache.get(ck);
    if(!hit){ hit=await cacheGet(ck); if(hit) memCache.set(ck,hit); }
    if(hit&&Date.now()-hit.t<ttl){ API_META.cachedAt=API_META.cachedAt==null?hit.t:Math.min(API_META.cachedAt,hit.t); return hit.j; }
  }
  u.searchParams.set('key',S.key);
  let r;
  try{ r=await fetch(u); }catch(e){ throw new AppErr("YouTube'ga ulanib bo'lmadi. Internetni tekshiring yoki faylni kompyuteringizda Chrome orqali oching.",'net'); }
  const j=await r.json().catch(()=>({}));
  quotaAdd(cost);
  if(!r.ok||j.error){
    const e=j.error||{};
    const reason=(e.errors&&e.errors[0]&&e.errors[0].reason)||(e.details&&e.details[0]&&e.details[0].reason)||e.status;
    throw new AppErr(errText(reason,e.message),reason);
  }
  memCache.set(ck,{t:Date.now(),j}); cachePut(ck,j);
  return j;
}

/* ---------- mappers & fetchers ---------- */
function bestThumb(t){ t=t||{}; return (t.medium||t.high||t.default||{}).url||''; }
function mapVideo(v){
  const s=v.statistics||{}, sn=v.snippet||{}, cd=v.contentDetails||{};
  return {
    id:v.id, title:sn.title||'', desc:sn.description||'', published:new Date(sn.publishedAt),
    channelId:sn.channelId, channelTitle:sn.channelTitle||'', categoryId:sn.categoryId,
    views:+s.viewCount||0, likes:s.likeCount!=null?+s.likeCount:null, comments:s.commentCount!=null?+s.commentCount:null,
    durSec:parseDur(cd.duration), tags:sn.tags||[], thumb:bestThumb(sn.thumbnails),
    thumbHi:((sn.thumbnails||{}).maxres||(sn.thumbnails||{}).high||(sn.thumbnails||{}).medium||{}).url||'',
    live:sn.liveBroadcastContent, lang:sn.defaultAudioLanguage||sn.defaultLanguage||''
  };
}
function mapChannel(c){
  const sn=c.snippet||{}, st=c.statistics||{}, b=(c.brandingSettings||{}).image||{};
  return {
    id:c.id, title:sn.title||'', handle:sn.customUrl||'', desc:sn.description||'', country:sn.country||'',
    created:new Date(sn.publishedAt), thumb:bestThumb(sn.thumbnails),
    banner:b.bannerExternalUrl?b.bannerExternalUrl+'=w1600-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj':'',
    subs:st.hiddenSubscriberCount?null:+st.subscriberCount, views:+st.viewCount||0, videoCount:+st.videoCount||0,
    uploads:((c.contentDetails||{}).relatedPlaylists||{}).uploads
  };
}
function parseChannelInput(s){
  s=String(s||'').trim(); let m;
  try{ s=decodeURIComponent(s); }catch(e){}
  if((m=s.match(/channel\/(UC[\w-]{20,})/))) return {id:m[1]};
  if((m=s.match(/^(UC[\w-]{20,})$/))) return {id:m[1]};
  if((m=s.match(/@([^\/?#\s]+)/))) return {handle:'@'+m[1]};
  if((m=s.match(/youtube\.com\/(?:c|user)\/([^\/?#]+)/))) return {user:m[1]};
  return {search:s};
}
function parseVideoInput(s){
  s=String(s||'').trim(); let m;
  if((m=s.match(/(?:v=|youtu\.be\/|shorts\/|live\/|embed\/)([\w-]{11})/))) return m[1];
  if(/^[\w-]{11}$/.test(s)&&/[\d_A-Z-]/.test(s)) return s;
  return null;
}
function detectInput(s){
  s=String(s||'').trim();
  if(!s) return null;
  if(parseVideoInput(s)) return 'video';
  if(/@|\/channel\/|youtube\.com\/(c|user)\/|^UC[\w-]{22}$/.test(s)) return 'channel';
  return 'keyword';
}
const CH_PARTS='snippet,statistics,contentDetails,brandingSettings';
async function resolveChannel(inp,opt){
  const p=parseChannelInput(inp);
  if(opt&&opt.noSearch) p.noSearch=true;
  let j;
  if(p.id) j=await api('channels',{part:CH_PARTS,id:p.id},1);
  else if(p.handle) j=await api('channels',{part:CH_PARTS,forHandle:p.handle},1);
  else if(p.user){ j=await api('channels',{part:CH_PARTS,forUsername:p.user},1); if(!j.items||!j.items.length) p.search=p.user; }
  if((!j||!j.items||!j.items.length)&&(p.search||p.handle)&&!p.noSearch){
    const sr=await api('search',{part:'snippet',type:'channel',q:p.search||p.handle,maxResults:1},100);
    const id=sr.items&&sr.items[0]&&sr.items[0].id.channelId;
    if(id) j=await api('channels',{part:CH_PARTS,id},1);
  }
  if(!j||!j.items||!j.items.length) throw new AppErr("Kanal topilmadi. @nom yoki kanal havolasini to'g'ri yozganingizni tekshiring.");
  return mapChannel(j.items[0]);
}
async function getVideos(ids,onProg){
  const out=[];
  for(let i=0;i<ids.length;i+=50){
    const j=await api('videos',{part:'snippet,statistics,contentDetails',id:ids.slice(i,i+50).join(','),maxResults:50},1);
    out.push(...(j.items||[]).map(mapVideo));
    onProg&&onProg(Math.min(ids.length,i+50),ids.length);
  }
  return out;
}
async function getUploads(ch,count,onProg){
  let ids=[], tok;
  while(ch.uploads&&ids.length<count){
    const j=await api('playlistItems',{part:'contentDetails',playlistId:ch.uploads,maxResults:50,pageToken:tok},1);
    ids.push(...(j.items||[]).map(i=>i.contentDetails.videoId));
    onProg&&onProg('list',ids.length);
    tok=j.nextPageToken; if(!tok) break;
  }
  /* rejalashtirilgan premyera/jonli efir (hali chiqmagan, 0 ko'rish) tahlilni buzmasin */
  return (await getVideos(ids.slice(0,count),(a,b)=>onProg&&onProg('vid',a,b))).filter(v=>v.live!=='upcoming');
}
async function getChannelsMap(ids){
  const out={};
  ids=[...new Set(ids.filter(Boolean))].sort();   // bir xil tartib = saqlangan natija qayta ishlatiladi
  for(let i=0;i<ids.length;i+=50){
    const j=await api('channels',{part:'snippet,statistics,contentDetails',id:ids.slice(i,i+50).join(',')},1);
    for(const c of j.items||[]) out[c.id]=mapChannel(c);
  }
  return out;
}
/* YouTube autocomplete (free, no quota) via JSONP */
let sgN=0;
function suggest(q,hl){
  return new Promise(res=>{
    if(!q||!q.trim()) return res([]);
    const cb='__ytsg'+(++sgN); let done=false;
    const sc=document.createElement('script');
    const clean=()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } sc.remove(); };
    window[cb]=d=>{ done=true; let arr=(d&&d[1])||[]; res(arr.map(x=>Array.isArray(x)?x[0]:x).filter(x=>typeof x==='string')); clean(); };
    sc.src='https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&hl='+encodeURIComponent(hl||'ko')+'&q='+encodeURIComponent(q)+'&callback='+cb;
    sc.charset='utf-8';
    sc.onerror=()=>{ if(!done){ done=true; res([]); clean(); } };
    setTimeout(()=>{ if(!done){ done=true; res([]); clean(); } },4500);
    document.head.append(sc);
  });
}

function words(t){
  return (String(t||'').toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N}'’ʻʼ]*/gu)||[])
    .map(w=>w.replace(/['’ʻʼ]+$/,''))

/* Views grow roughly like age^0.4 over a video's life; we use it to compare
   a 3-day-old and a 2-year-old video fairly ("30-day equivalent" views). */
const AGE_K=0.4;
function ageNorm(v){ const a=clamp(v.age,3,3650); return v.views*Math.pow(30/a,AGE_K); }
function views30(v){ return v.age<=30?v.views:v.views*(1-Math.pow((v.age-30)/v.age,AGE_K)); }
function enrich(vids){
  const now=Date.now();
  for(const v of vids){
    v.age=Math.max(1/24,(now-v.published)/864e5);
    v.vpd=v.views/Math.max(1,v.age);
    v.vph=v.views/Math.max(1,v.age*24);
    v.eng=v.views?((v.likes||0)+(v.comments||0))/v.views:0;
    v.likeRate=v.views&&v.likes!=null?v.likes/v.views:null;
    const tx=((v.title||'')+' '+(v.desc||'')+' '+(v.tags||[]).join(' ')).toLowerCase();
    v.isShort=v.durSec>0&&(v.durSec<=60||(v.durSec<=180&&/#shorts?\b|#쇼츠|#short|shorts/.test(tx)));
    v.isNew=v.age<3;
    v.norm=ageNorm(v);
    v.wd=(v.published.getDay()+6)%7;
    v.hr=v.published.getHours();
  }
  const mature=vids.filter(v=>v.age>=7);
  const base=median((mature.length>=5?mature:vids).map(v=>v.views))||1;
  const pool=vids.filter(v=>v.age>=3);
  const nbase=median((pool.length>=5?pool:vids).map(v=>v.norm))||1;
  for(const v of vids) v.score=v.norm/nbase;
  vids._nbase=nbase;
  return base;
}
function scoreCls(x){ return x>=5?'hot':x>=2?'warm':x<0.5?'low':''; }
const DUR_B=[
  {l:'Shorts',s:'≤ 1 daq',a:0,b:60},{l:'Qisqa',s:'1–3 daq',a:61,b:180},{l:"O'rta",s:'3–8 daq',a:181,b:480},
  {l:'Standart',s:'8–15 daq',a:481,b:900},{l:'Uzun',s:'15–30 daq',a:901,b:1800},{l:'Juda uzun',s:'30+ daq',a:1801,b:1e9}];
function titleFeatures(vids){
  const F=[
    {k:'num',l:'Raqam bor',d:'masalan: "5 ta", "2026"',t:x=>/\d/.test(x)},
    {k:'q',l:'Savol belgisi',d:'"?" bilan',t:x=>/[?？]/.test(x)},
    {k:'br',l:'Qavs yoki [ ]',d:'(...) yoki [...]',t:x=>/[(\[【「]/.test(x)},
    {k:'emo',l:'Emoji',d:'sarlavhada emoji',t:x=>/\p{Extended_Pictographic}/u.test(x)},
    {k:'caps',l:'KATTA HARFLI so\'z',d:'kamida bitta to\'liq katta so\'z',t:x=>/(^|[^\p{L}])\p{Lu}{3,}(?=$|[^\p{L}])/u.test(x)},
    {k:'long',l:'Uzun sarlavha',d:'60 belgidan ko\'p',t:x=>x.length>60},
    {k:'bar',l:'"|" ajratgich',d:'sarlavhada | belgisi',t:x=>/[|｜]/.test(x)}];
  const pool=vids.filter(v=>v.age>=3);
  return F.map(f=>{
    const yes=pool.filter(v=>f.t(v.title)), no=pool.filter(v=>!f.t(v.title));
    const my=median(yes.map(v=>v.score)), mn=median(no.map(v=>v.score));
    return {...f,ny:yes.length,nn:no.length,lift:yes.length>=3&&no.length>=3&&mn?my/mn-1:null};
  });
}
function topWordsByScore(vids,min){
  const m={};
  for(const v of vids){ for(const w of new Set(words(v.title))){ (m[w]=m[w]||[]).push(v.score); } }
  return Object.entries(m).filter(([,a])=>a.length>=(min||3)).map(([w,a])=>({w,n:a.length,s:median(a)})).sort((a,b)=>b.s-a.s);
}
function tagFreq(vids){
  const m={};
  for(const v of vids) for(const t of v.tags||[]){ const k=t.toLowerCase().trim(); if(k) m[k]=(m[k]||0)+1; }
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function channelReport(ch,vids){
  const base=enrich(vids);
  const byDate=[...vids].sort((a,b)=>a.published-b.published);
  const mature=byDate.filter(v=>v.age>=3);
  const span=clamp(Math.max(...vids.map(v=>v.age),0),7,90), perWeek=vids.filter(v=>v.age<=span).length/(span/7);
  const rec=mature.slice(-10), prev=mature.slice(-30,-10);
  const momentum=rec.length>=5&&prev.length>=5?median(rec.map(v=>v.norm))/median(prev.map(v=>v.norm)):null;
  const engM=median(vids.filter(v=>v.views>100).map(v=>v.eng))||0;
  const hitRate=vids.length?vids.filter(v=>v.score>=2).length/vids.length:0;
  const shorts=vids.filter(v=>v.isShort), longs=vids.filter(v=>!v.isShort);
  // heatmap 7x6
  const heat=Array.from({length:7},()=>Array.from({length:6},()=>[]));
  for(const v of mature) heat[v.wd][Math.floor(v.hr/4)].push(v.score);
  // durations
  const durs=DUR_B.map(b=>{ const g=mature.filter(v=>v.durSec>=b.a&&v.durSec<=b.b); return {...b,n:g.length,med:median(g.map(v=>v.score))}; });
  // months (last 12)
  const now=new Date(), months=[];
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({y:d.getFullYear(),m:d.getMonth(),n:0,v:[]}); }
  for(const v of vids){ const mo=months.find(x=>x.y===v.published.getFullYear()&&x.m===v.published.getMonth()); if(mo){ mo.n++; mo.v.push(v.views); } }
  // earnings
  const monthly=monthlyViews(ch,vids);
  // health
  const parts=[
    {k:'Muntazamlik',v:clamp(perWeek/3,0,1)*25,d:perWeek.toFixed(1)+' ta video / hafta',c:'var(--d1)'},
    {k:'Faollik',v:clamp(engM/0.06,0,1)*25,d:pct(engM)+' layk + izoh',c:'var(--d2)'},
    {k:"O'sish sur'ati",v:momentum==null?12.5:clamp((momentum-0.5)/1,0,1)*25,d:momentum==null?"ma'lumot kam":(momentum>=1?'+':'')+pct(momentum-1,0)+' oxirgi videolarda',c:'var(--d4)'},
    {k:'Hit videolar',v:clamp(hitRate/0.2,0,1)*25,d:pct(hitRate,0)+' video 2× dan yuqori',c:'var(--accent)'}];
  const health=Math.round(sum(parts.map(p=>p.v)));
  const tf=titleFeatures(vids);
  const tw=topWordsByScore(vids,3);
  const tags=tagFreq(vids);
  const rep={ch,vids,base,byDate,perWeek,span,momentum,engM,hitRate,shorts,longs,heat,durs,months,monthly,parts,health,tf,tw,tags};
  rep.tips=makeTips(rep);
  return rep;
}
function grade(x){ return x>=80?['A',"Zo'r",'var(--good)']:x>=65?['B','Yaxshi','var(--d4)']:x>=50?['C',"O'rtacha",'var(--d3)']:x>=35?['D','Past','var(--hot)']:['E','Juda past','var(--bad)']; }
function makeTips(r){
  const T=[];
  const b=x=>h('b',{text:x});
  // best slot
  let best=null;
  r.heat.forEach((row,d)=>row.forEach((c,s)=>{ if(c.length>=2){ const m=median(c); if(!best||m>best.m) best={d,s,m,n:c.length}; } }));
  if(best) T.push({tone:'info',ic:'clock',p:['Eng yaxshi yuklash vaqti: ',b(`${WDF[best.d]}, ${String(best.s*4).padStart(2,'0')}:00–${String(best.s*4+4).padStart(2,'0')}:00`),` — shu vaqtda chiqqan ${best.n} ta video odatda kanal o'rtachasidan ${best.m.toFixed(1)}× natija bergan.`]});
  // best duration
  const db=r.durs.filter(x=>x.n>=3).sort((a,b2)=>b2.med-a.med)[0];
  if(db) T.push({tone:'info',ic:'ruler',p:["Eng yaxshi ishlaydigan uzunlik: ",b(`${db.l} (${db.s})`),` — bunday videolar odatda kanal o'rtachasidan ${db.med.toFixed(1)}× natija beradi.`]});
  // momentum
  if(r.momentum!=null){
    if(r.momentum>=1.2) T.push({tone:'good',ic:'up',p:["Kanal o'smoqda: oxirgi 10 video oldingilardan ",b(pct(r.momentum-1,0)+" ko'p"),' ko\'rilgan. Shu yo\'nalishni davom ettiring.']});
    else if(r.momentum<=0.8) T.push({tone:'bad',ic:'down',p:["Oxirgi videolar oldingilardan ",b(pct(1-r.momentum,0)+' kam'),' ko\'rilmoqda. Outlier videolardagi mavzularga qayting.']});
  }
  // frequency
  if(r.perWeek<1) T.push({tone:'warn',ic:'calendar',p:['Yuklash tezligi past: haftasiga ',b(r.perWeek.toFixed(1)+' ta'),'. Muntazam (haftasiga 1–3 ta) yuklash algoritmga yordam beradi.']});
  else if(r.perWeek>=3) T.push({tone:'good',ic:'calendar',p:['Yuklash muntazam: haftasiga ',b(r.perWeek.toFixed(1)+' ta'),' video.']});
  // title feature
  const tf=r.tf.filter(f=>f.lift!=null&&Math.abs(f.lift)>=0.25).sort((a,c)=>Math.abs(c.lift)-Math.abs(a.lift))[0];
  if(tf) T.push({tone:tf.lift>0?'good':'warn',ic:'type',p:[`Sarlavhada "${tf.l.toLowerCase()}" bo'lgan videolar `,b((tf.lift>0?'+':'')+pct(tf.lift,0)),tf.lift>0?' ko\'proq ko\'rilgan.':' kamroq ko\'rilgan.']});
  // top topic
  const top=[...r.vids].sort((a,c)=>c.score-a.score)[0];
  if(top&&top.score>=3) T.push({tone:'good',ic:'flame',p:['Eng kuchli mavzu: ',b('«'+top.title.slice(0,70)+(top.title.length>70?'…':'')+'»'),` — odatiydan ${top.score.toFixed(1)}× ko'p. Shunga o'xshash video qiling.`]});
  // shorts vs long
  if(r.shorts.length>=3&&r.longs.length>=3){
    const ms=median(r.shorts.filter(v=>v.age>=7).map(v=>v.views)), ml=median(r.longs.filter(v=>v.age>=7).map(v=>v.views));
    const enough=r.shorts.filter(v=>v.age>=7).length>=3&&r.longs.filter(v=>v.age>=7).length>=3;
    if(enough&&ms&&ml) T.push({tone:'info',ic:'film',p:['Shorts odatda ',b(compact(ms)),', uzun videolar ',b(compact(ml)),' ko\'rish oladi.']});
  }
  // engagement
  if(r.engM>=0.06) T.push({tone:'good',ic:'heart',p:['Tomoshabinlar faol: ',b(pct(r.engM)),' (yaxshi ko\'rsatkich 4–6%).']});
  else if(r.engM<0.02&&r.vids.length>5) T.push({tone:'warn',ic:'heart',p:['Faollik past: ',b(pct(r.engM)),'. Videoda savol bering va izoh yozishga chaqiring.']});
  return T.slice(0,6);
}
/* Monthly views: real numbers from tracker snapshots when available,
   otherwise a model based on each video's age. */
function monthlyViews(ch,vids){
  let lv=0,sv=0;
  for(const v of vids){ const g=views30(v); if(v.isShort) sv+=g; else lv+=g; }
  const fetched=sum(vids.map(v=>v.views)), rest=Math.max(0,(ch.views||0)-fetched);
  if(rest>0&&vids.length){
    const ta=Math.max(...vids.map(v=>v.age))+180, g=rest*(1-Math.pow((ta-30)/ta,AGE_K)), sh=lv/((lv+sv)||1);
    lv+=g*sh; sv+=g*(1-sh);
  }
  const longShare=lv/((lv+sv)||1);
  const s=(typeof S!=='undefined'&&S.saved||[]).find(x=>x.id===ch.id);
  if(s&&s.snaps.length>=2){
    const a=s.snaps[0], b=s.snaps[s.snaps.length-1], days=(b.t-a.t)/864e5;
    if(days>=0.9&&b.views>=a.views){ const m=(b.views-a.views)/days*30; return {lv:m*longShare,sv:m*(1-longShare),v:m,method:'track',days}; }
  }
  return {lv,sv,v:lv+sv,method:'model'};
}
function earnings(longViews,shortViews){
  return {min:longViews/1000*S.set.rpmMin+shortViews/1000*S.set.sMin, max:longViews/1000*S.set.rpmMax+shortViews/1000*S.set.sMax};
}

/* ---------- O'xshash kanallar ----------
   YouTube API'da "o'xshash kanallar" degan tayyor funksiya yo'q (relatedToVideoId 2023-yilda o'chirilgan).
   Shuning uchun: kanalning o'zi ishlatgan eng kuchli teglar/so'zlar bo'yicha oxirgi 4 oydagi videolar
   qidiriladi (100 birlik), natijada ko'p uchragan kanallar olinadi, hajmi sizga yaqinlari oldinga chiqadi,
   keyin har birining oxirgi 30 videosi (2 birlik) olinib, o'z kanali odatiysidan ko'p ko'rilganlari tanlanadi. */
const SIM_N=8, SIM_COST=100+1+2*SIM_N;
const LANG_REG={ko:'KR',ja:'JP',ru:'RU',uz:'UZ',tr:'TR',kk:'KZ',de:'DE',hi:'IN',vi:'VN',th:'TH',id:'ID',fr:'FR',es:'ES',pt:'BR'};
const LANG_UZ={ko:'koreys',en:'ingliz',ru:'rus',uz:"o'zbek",ja:'yapon',tr:'turk',kk:'qozoq',de:'nemis',hi:'hind',es:'ispan',fr:'fransuz',pt:'portugal',vi:'vyetnam',th:'tay',id:'indonez'};
function simGet(id){ const all=store.get('sim',{}); const d=all[id]||{}; return {q:d.q||null,mode:d.mode==='pins'?'pins':'auto',pins:Array.isArray(d.pins)?d.pins:[],hide:Array.isArray(d.hide)?d.hide:[]}; }
function simSet(id,d){ const all=store.get('sim',{}); all[id]=d; store.set('sim',all); }
function scriptOf(t){ t=String(t||''); if(/[ㄱ-힝]/.test(t)) return 'ko'; if(/[ぁ-ゟ゠-ヿ]/.test(t)) return 'ja'; if(/[Ѐ-ӿ]/.test(t)) return 'cyr'; if(/[؀-ۿ]/.test(t)) return 'ar'; if(/\p{L}/u.test(t)) return 'lat'; return ''; }
const LANG_SCRIPT={ko:'ko',ja:'ja',ru:'cyr',kk:'cyr',uk:'cyr',ar:'ar'};
function chLang(vids){
  const c={}; for(const v of vids){ const l=String(v.lang||'').toLowerCase().split(/[-_]/)[0]; if(l&&l!=='zxx'&&l!=='und') c[l]=(c[l]||0)+1; }
  const best=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
  if(best&&best[1]>=Math.max(2,vids.length*0.2)) return best[0];
  const sc={}; for(const v of vids){ const s=scriptOf(v.title); if(s) sc[s]=(sc[s]||0)+1; }
  const s=(Object.entries(sc).sort((a,b)=>b[1]-a[1])[0]||[])[0];
  if(s==='ko'||s==='ja') return s; if(s==='cyr') return 'ru';
  const t=vids.map(v=>v.title).join(' ').toLowerCase();
  if(/\b(va|uchun|qanday|bilan|nima|haqida)\b|oʻ|gʻ|o‘|g‘|\bo'|g'/.test(t)) return 'uz';
  return 'en';
}
/* kanalning mavzusini eng yaxshi ifodalaydigan 4 ta so'z/ibora */
function simTerms(r,lang){
  const ownName=String(r.ch.title||'').toLowerCase().replace(/\s+/g,''), ownW=new Set(words(r.ch.title).concat(words(String(r.ch.handle||'').replace('@',''))));
  const bad=new Set(['shorts','short','쇼츠','숏츠','youtube','유튜브','video','videos','vlog','브이로그','viral','trending','subscribe','구독','fyp','reels']);
  const want=LANG_SCRIPT[lang]||'lat';
  const m=new Map();
  const add=(t,w)=>{
    t=String(t||'').toLowerCase().replace(/^#/,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
    if(t.length<2||t.length>32||STOP.has(t)||bad.has(t)||ownW.has(t)||/^\d+$/.test(t)) return;
    if(ownName.length>=3&&t.replace(/\s/g,'').includes(ownName)) return;
    const sc=scriptOf(t); if(sc&&sc!==want) w*=0.45;
    m.set(t,(m.get(t)||0)+w);
  };
  for(const v of r.vids){
    const w=1+Math.log2(1+clamp(v.score||1,0,20));
    for(const tg of new Set((v.tags||[]).map(x=>String(x).toLowerCase()))) add(tg,w*(/\s/.test(tg)?1.4:1));
    for(const ht of new Set(String(v.desc||'').match(/#[\p{L}\p{N}_]+/gu)||[])) add(ht,w*0.5);
  }
  for(const x of r.tw.slice(0,25)) add(x.w,x.n*0.7*clamp(x.s,0.5,3));
  if(m.size<3){ const f={}; for(const v of r.vids) for(const w of new Set(words(v.title))) f[w]=(f[w]||0)+1; for(const [w,n] of Object.entries(f)) if(n>=2) add(w,n*0.8); }
  const ranked=[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,14);
  const sq=x=>x.replace(/\s/g,'');
  /* "한국" va "한국 역사" bo'lsa — aniqrog'i ("한국 역사") qoladi, umumiysi tashlanadi */
  const kept=ranked.filter(([t,w])=>!ranked.some(([L,wl])=>L!==t&&L.length>t.length&&sq(L).includes(sq(t))&&wl>=w*0.3));
  const out=[];
  for(const [t] of kept){ if(out.length>=4) break; if(out.some(o=>sq(o).includes(sq(t))||sq(t).includes(sq(o)))) continue; out.push(t); }
  return out;
}
function simQuery(terms){ return terms.map(t=>/\s/.test(t)?'"'+t.replace(/"/g,'')+'"':t.replace(/"/g,'')).join('|'); }
function parseTerms(s){ return [...new Set(String(s||'').split(/[|,;\n]+/).map(x=>x.trim().replace(/^["']+|["']+$/g,'').trim()).filter(x=>x.length>=2))].slice(0,6); }
function fatal(e){ return e&&(e.code==='nokey'||e.code==='net'||e.code==='cancel'||/quota|limit|key|forbidden/i.test(e.code||'')); }
async function findSimilar(r,opt){
  opt=opt||{}; const step=opt.onStep||(()=>{}), alive=opt.alive||(()=>true);
  const me=r.ch, cfg=simGet(me.id), lang=chLang(r.vids), region=me.country||LANG_REG[lang]||'';
  const autoTerms=simTerms(r,lang), terms=cfg.q?parseTerms(cfg.q):autoTerms;
  const hide=new Set(cfg.hide), exclude=new Set([me.id,...S.mine.map(m=>m.id).filter(Boolean),...hide]);
  const pinIds=cfg.pins.map(p=>p.id).filter(id=>id&&!hide.has(id)&&id!==me.id);
  const hits={}; let searched=false;
  if(cfg.mode!=='pins'||!pinIds.length){
    if(!terms.length) throw new AppErr("Kanal mavzusini aniqlab bo'lmadi (teg va takrorlanuvchi so'z yo'q). «Kalit so'zlarni o'zgartirish» tugmasini bosib, mavzuni o'zingiz yozing.",'noterms');
    step("O'xshash mavzudagi videolar qidirilmoqda…");
    const p={part:'snippet',type:'video',q:simQuery(terms),maxResults:50,order:'relevance',
      publishedAfter:new Date(Math.floor(Date.now()/864e5-120)*864e5).toISOString(),regionCode:region,relevanceLanguage:lang};
    const sr=await api('search',p,100); searched=true;
    (sr.items||[]).forEach((it,i)=>{ const c=it.snippet&&it.snippet.channelId; if(!c||exclude.has(c)) return; const x=hits[c]=hits[c]||{n:0,best:i}; x.n++; x.best=Math.min(x.best,i); });
  }
  if(!alive()) throw new AppErr('cancel','cancel');
  const found=Object.keys(hits).sort((a,b)=>hits[b].n-hits[a].n||hits[a].best-hits[b].best).slice(0,24);
  const cand=[...new Set([...pinIds,...found])];
  if(!cand.length) return {terms,autoTerms,lang,region,searched,chans:[]};
  step("Topilgan kanallar ma'lumoti olinmoqda…");
  const map=await getChannelsMap(cand);
  const ownSubs=me.subs;
  let chans=cand.map(id=>map[id]).filter(c=>c&&(c.videoCount>=3||pinIds.includes(c.id))).map(c=>{
    const x=hits[c.id]||{n:0,best:99}, ratio=ownSubs&&c.subs?c.subs/ownSubs:null;
    const fit=ratio==null?0.5:1-Math.min(1,Math.abs(Math.log10(ratio))/2.5);   // hajmi yaqin = 1, 300× farq = 0
    const rel=Math.min(1,x.n/5)*0.8+(x.best<10?0.2:x.best<25?0.1:0);       // mavzuga moslik
    const pin=pinIds.includes(c.id);
    return Object.assign(c,{hits:x.n,ratio,fit,rel,pin,rank:(pin?10:0)+rel*0.65+fit*0.35});
  }).sort((a,b)=>b.rank-a.rank);
  chans=chans.slice(0,Math.max(opt.n||SIM_N,pinIds.length));
  for(let i=0;i<chans.length;i++){
    if(!alive()) throw new AppErr('cancel','cancel');
    const c=chans[i]; step(`Raqiblar videolari: ${i+1} / ${chans.length} — ${c.title}`);
    try{
      const vs=await getUploads(c,30);
      c.base=enrich(vs); c.vids=vs;
      for(const v of vs){ v.subs=c.subs; v.chThumb=c.thumb; }
      const sp=clamp(Math.max(...vs.map(v=>v.age),0),7,90); c.perWeek=vs.filter(v=>v.age<=sp).length/(sp/7);
    }catch(e){ if(fatal(e)) throw e; c.vids=[]; c.err=true; }
  }
  return {terms,autoTerms,lang,region,searched,chans};
}
/* raqiblarning hozir "o'q uzgan" videolari: o'z kanali odatiysidan yuqori, yangi, har kanaldan ko'pi bilan 2 ta */
function simTrending(chans,filt,max){
  const ok=v=>filt==='all'||(filt==='short'?v.isShort:!v.isShort);
  const pool=(d,min)=>chans.flatMap(c=>(c.vids||[]).filter(v=>v.age>=0.25&&v.age<=d&&v.score>=min&&ok(v)));
  let win=30, p=pool(30,1.3);
  if(p.length<6){ win=60; p=pool(60,1.3); }
  if(p.length<4){ win=120; p=pool(120,1); }
  p.sort((a,b)=>b.score-a.score||b.vph-a.vph);
  const per={}, out=[];
  for(const v of p){ if((per[v.channelId]||0)>=2) continue; per[v.channelId]=(per[v.channelId]||0)+1; out.push(v); if(out.length>=(max||12)) break; }
  return {list:out,win};
}
/* raqiblarda yaxshi ishlagan, lekin sizning sarlavhalaringizda hali uchramagan so'zlar */
function simGap(r,chans){
  const own=new Set(r.vids.flatMap(v=>words(v.title)));
  const names=new Set(chans.flatMap(c=>words(c.title)).concat(words(r.ch.title)));
  const m={};
  for(const c of chans) for(const v of c.vids||[]){
    if(v.score<1.5||v.age<2) continue;
    for(const w of new Set(words(v.title))){ if(own.has(w)||names.has(w)) continue; const e=m[w]=m[w]||{w,n:0,ch:new Set(),s:[],v:[]}; e.n++; e.ch.add(c.id); e.s.push(v.score); e.v.push(v); }
  }
  return Object.values(m).filter(e=>e.ch.size>=2||e.n>=3).map(e=>({w:e.w,n:e.n,c:e.ch.size,s:median(e.s),v:e.v}))
    .sort((a,b)=>b.c-a.c||b.n*b.s-a.n*a.s).slice(0,18);
}
function simPrompt(r,res,trend){
  const L=LANG_UZ[res.lang]||res.lang;
  const top=[...r.vids].filter(v=>v.age>=3).sort((a,b)=>b.score-a.score).slice(0,8);
  return [`Men «${r.ch.title}» YouTube kanalining egasiman (${r.ch.subs!=null?compact(r.ch.subs)+' obunachi, ':''}kanal tili: ${L}).`,'',
    "Mening eng yaxshi ishlagan videolarim (kanalim odatiysiga nisbatan necha barobar):",
    ...top.map((v,i)=>`${i+1}. ${v.title} — ${compact(v.views)} ko'rish, ${v.score.toFixed(1)}×${v.isShort?' (Shorts)':''}`),'',
    "O'xshash kanallarda hozir eng yaxshi ishlayotgan videolar (o'z kanali odatiysiga nisbatan):",
    ...trend.slice(0,12).map((v,i)=>`${i+1}. ${v.title} — ${v.channelTitle}, ${compact(v.views)} ko'rish, ${v.score.toFixed(1)}×, ${ago(v.published)}${v.isShort?' (Shorts)':''}`),'',
    `Vazifa: shu ma'lumotlar asosida kanalim uchun 10 ta yangi video g'oyasini taklif qil. Har biri uchun: 1) sarlavha (${L} tilida), 2) nima uchun ishlashi mumkin (1 jumla), 3) Shorts yoki uzun video. Raqiblar videolarini ko'chirma — mavzuni mening kanalim uslubiga moslashtir. Izohlarni o'zbek tilida yoz, faqat sarlavhalar ${L} tilida bo'lsin.`].join('\n');
}

const PL={list:[],i:0,ov:null,back:null};
function isRealId(id){ return typeof id==='string'&&/^[\w-]{11}$/.test(id); }
function plainClick(e){ return !(e.button||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey); }
function playVideo(v,list){
  if(!v||!isRealId(v.id)) return;
  const L=(list&&list.length?list:[v]).filter(x=>x&&isRealId(x.id));
  let i=L.findIndex(x=>x.id===v.id);
  PL.list=i<0?[v]:L; PL.i=i<0?0:i;
  if(!PL.ov) plBuild();

  plDraw(); PL.ov.hidden=false; document.documentElement.style.overflow='hidden';

function plClose(){

  if(PL.back&&PL.back.isConnected&&PL.back.focus) PL.back.focus({preventScroll:true});

function plStep(d){ const j=PL.i+d; if(j<0||j>=PL.list.length) return; PL.i=j; plDraw(); }
function plBuild(){
  PL.cnt=h('span',{class:'hint'}); PL.stage=h('div',{class:'pl-stage'}); PL.bd=h('div',{class:'pl-bd'});
  PL.ov=h('div',{class:'pl-ov',hidden:true,role:'dialog','aria-modal':'true','aria-label':'Video pleyer',onclick:e=>{ if(e.target===PL.ov) plClose(); }},
    h('div',{class:'pl-box'},
      h('div',{class:'pl-hd'},PL.cnt,h('span',{style:'flex:1'}),
        h('button',{class:'iconbtn pl-x',type:'button','aria-label':'Yopish',title:'Yopish (Esc)',onclick:plClose},icon('x',18,2.2))),
      PL.stage,PL.bd));
  document.body.append(PL.ov);
  document.addEventListener('keydown',e=>{
    if(!PL.ov||PL.ov.hidden) return;
    if(e.key==='Escape'){ e.preventDefault(); plClose(); return; }
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;

/* sparkline */
function sparkline(vals,o){
  o=o||{}; const w=o.w||160, hh=o.h||36;
  vals=vals.filter(v=>v!=null&&isFinite(v));
  if(vals.length<2) return null;
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=mx-mn||1;
  const xs=o.xs&&o.xs.length===vals.length?o.xs:null, x0=xs?xs[0]:0, xr=xs?(xs[xs.length-1]-x0)||1:1;
  const pts=vals.map((v,i)=>[(xs?(xs[i]-x0)/xr:i/(vals.length-1))*(w-4)+2, hh-3-(v-mn)/rg*(hh-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const col=o.color||'var(--d1)';
  const last=pts[pts.length-1];

    sv('path',{d:d+` L${last[0]} ${hh} L${pts[0][0]} ${hh} Z`,fill:col,opacity:.12,stroke:'none'}),
    sv('path',{d,fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round','vector-effect':'non-scaling-stroke'}),
