/* performance scatter: each video views (log) over publish date */
function perfChart(vids,base,o){
  o=o||{};
  const host=h('div',{class:'chart'});
  return responsive(host,W=>{
    const H=o.h||300, m={l:62,r:14,t:16,b:30};
    const vs=vids.filter(v=>v.views>=0);
    if(vs.length<2) return h('p',{class:'hint',text:"Grafik uchun video yetarli emas."});
    const t0=Math.min(...vs.map(v=>+v.published)), t1=Math.max(...vs.map(v=>+v.published));
    const pad=(t1-t0)*0.03||864e5;
    const x=t=>m.l+(t-(t0-pad))/((t1+pad)-(t0-pad))*(W-m.l-m.r);
    const vmin=Math.max(1,Math.min(...vs.map(v=>v.views||1))), vmax=Math.max(10,...vs.map(v=>v.views));
    const lo=Math.floor(Math.log10(vmin)), hi=Math.ceil(Math.log10(vmax))+(Math.log10(vmax)%1===0?0.15:0);
    const y=v=>m.t+(1-(Math.log10(Math.max(1,v))-lo)/(hi-lo))*(H-m.t-m.b);
    const g=sv('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':"Videolar ko'rishlari vaqt bo'yicha"});
    // y grid
    const ticks=[];
    for(let p=lo;p<=Math.floor(hi);p++){ ticks.push(10**p); if(hi-lo<=3&&10**p*3<=10**hi) ticks.push(3*10**p); }
    for(const tv of ticks){ const yy=y(tv); if(yy<m.t-1||yy>H-m.b+1) continue;
      g.append(sv('line',{x1:m.l,x2:W-m.r,y1:yy,y2:yy,stroke:'var(--line)','stroke-width':1}));
      g.append(sv('text',{x:m.l-8,y:yy+4,'text-anchor':'end',text:compact(tv)})); }
    // x ticks: months
    const span=t1-t0, n=Math.max(2,Math.min(6,Math.floor((W-m.l)/110)));
    for(let i=0;i<=n;i++){ const t=t0+span*i/n, d=new Date(t), xx=x(t);
      g.append(sv('text',{x:xx,y:H-8,'text-anchor':i===0?'start':i===n?'end':'middle',text:MON[d.getMonth()]+" '"+String(d.getFullYear()).slice(2)})); }
    // median line
    const yb=y(base);
    g.append(sv('line',{x1:m.l,x2:W-m.r,y1:yb,y2:yb,stroke:'var(--muted)','stroke-dasharray':'5 5','stroke-width':1.2}));
    g.__lbl=sv('text',{x:W-m.r-4,y:yb-7,'text-anchor':'end',class:'halo',text:"odatiy: "+compact(base)});
    // rolling median
    const sorted=[...vs].sort((a,b)=>a.published-b.published), win=Math.max(3,Math.min(9,Math.round(sorted.length/8)));
    const rm=sorted.map((v,i)=>{ const s=sorted.slice(Math.max(0,i-win+1),i+1); return [x(+v.published),y(median(s.map(z=>z.views))||1)]; });
    const rmv=rm.slice(win-1);
    if(rmv.length>3) g.append(sv('path',{d:rmv.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),fill:'none',stroke:'var(--d2)','stroke-width':2.4,'stroke-linejoin':'round',opacity:.9}));
    // dots
    for(const v of sorted){
      const cls=scoreCls(v.score), col=cls==='hot'?'var(--hot)':cls==='warm'?'var(--d3)':cls==='low'?'var(--muted)':'var(--d1)';
      const r=cls==='hot'?6.5:cls==='warm'?5.5:4.2;
      const dot=sv('circle',{cx:x(+v.published),cy:y(v.views),r,fill:v.isShort?'var(--surface)':col,stroke:col,'stroke-width':v.isShort?2:1.2,'fill-opacity':v.isShort?1:.85,style:'cursor:pointer'});
      tipOn(dot,()=>[h('b',{text:v.title}),h('div',{class:'mono',text:`${full(v.views)} ko'rish · ${v.score.toFixed(1)}×`}),h('div',{text:dateUz(v.published)+(v.isShort?' · Shorts':'')+' · '+dur(v.durSec)})]);
      if(!o.sample) dot.addEventListener('click',()=>{ hideTip(); playVideo(v,sorted); });
      g.append(dot);
    }
    g.append(g.__lbl);
    return g;
  });
}

/* heatmap */
function heatmap(heat){
  const meds=heat.map(r=>r.map(c=>c.length?median(c):null));
  const all=meds.flat().filter(v=>v!=null), mx=Math.max(1,...all);
  let best=null; meds.forEach((r,d)=>r.forEach((m,s)=>{ if(m!=null&&heat[d][s].length>=2&&(!best||m>best.m)) best={d,s,m}; }));
  const g=h('div',{class:'heat'});
  g.append(h('div'));
  for(let s=0;s<6;s++) g.append(h('div',{class:'hd',text:String(s*4).padStart(2,'0')+'–'+String(s*4+4).padStart(2,'0')}));
  meds.forEach((r,d)=>{
    g.append(h('div',{class:'rl',text:WD[d]}));
    r.forEach((m,s)=>{
      const n=heat[d][s].length, k=m==null?0:Math.sqrt(m/mx);
      const c=h('div',{class:'c'+(best&&best.d===d&&best.s===s?' best':''),style:m==null?'':`background:color-mix(in srgb,var(--d1) ${Math.round(12+k*78)}%,var(--surface-3));color:${k>0.55?'#fff':'var(--ink-2)'}`,text:n?String(n):''});
      tipOn(c,()=>[h('b',{text:`${WDF[d]}, ${String(s*4).padStart(2,'0')}:00–${String(s*4+4).padStart(2,'0')}:00`}),h('div',{text:n?`${n} ta video · kanal o'rtachasidan ${m.toFixed(1)}×`:"Bu vaqtda video yuklanmagan"})]);
      g.append(c);
    });
  });
  return {el:g,best};
}

      if(m.err&&!fresh&&Date.now()-(m.errT||0)<24*3600e3) continue;

function sampleChannel(){
  let seed=19; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const T=["Koreyada birinchi oy: nimalarga tayyor bo'lish kerak","Seulda arzon ovqatlanish: 5 ta joy","Koreyada ish topish — mening tajribam","T-money kartasi qanday ishlaydi?","Koreys tilini 3 oyda o'rgandim: usulim","Koreyadagi oylik xarajatlarim (2026)","Zavodda bir kunlik smena | vlog","Koreys supermarketida narxlar","Busan sayohati 1 kunda","Koreyada uy ijarasi: 월세 va 전세 farqi","Koreyada shifoxonaga borish tartibi","Koreyslar bizdan nimasi bilan farq qiladi?","Koreyada qishki kiyim qayerdan arzon","Koreyada haydovchilik guvohnomasi olish","Daiso'dan foydali 10 ta narsa","Koreyada bank kartasi ochish","Koreyadagi o'zbek kafelari","Koreyada birinchi maoshim qancha bo'ldi?","Jeju oroliga arzon sayohat","Koreyada telefon raqam olish — 3 ta usul"];
  const tagsPool=['koreya','korea vlog','koreyada hayot','한국생활','seul','koreyada ish','uzbek in korea','koreys tili','vlog','koreyada narxlar'];
  const vids=[]; const now=Date.now();
  for(let i=0;i<60;i++){
    const age=1.5+i*5.2+rnd()*3;
    let views=Math.round(5200*(0.45+rnd()*1.1)*Math.min(1,age/12)*(1+0.012*Math.max(0,120-age)));
    const t=T[i%T.length];
    if(/\d/.test(t)) views=Math.round(views*1.35);
    if(rnd()<0.12) views*=Math.round(4+rnd()*6);
    const short=rnd()<0.28;
    const d=new Date(now-age*864e5); d.setHours([10,12,18,19,20,21,15,9][Math.floor(rnd()*8)],Math.floor(rnd()*60));
    if(d.getDay()===5) views=Math.round(views*1.3);
    vids.push({id:'s'+i,title:t,desc:'',published:d,views,likes:Math.round(views*(0.03+rnd()*0.025)),comments:Math.round(views*(0.003+rnd()*0.003)),
      durSec:Math.round(short?20+rnd()*40:280+rnd()*820),tags:tagsPool.filter(()=>rnd()<0.45),thumb:'',channelTitle:'Namuna kanal'});
  }
  return {ch:{id:'sample',title:'Namuna kanal',handle:'@namuna_kanal',desc:"Koreyadagi hayot haqida o'zbek tilida kundalik vloglar, maslahatlar va narxlar.",country:'KR',created:new Date(now-3.2*365*864e5),thumb:'',banner:'',subs:48200,views:2860000,videoCount:126},vids};
}

/* ======================= O'XSHASH KANALLAR (kanal tahlili oxirida) ======================= */
function normRef(x){ x=String(x||'').trim(); try{ x=decodeURIComponent(x); }catch(e){} const m=x.match(/@([^\/?#\s]+)/); return (m?'@'+m[1]:x).toLowerCase(); }
/* "Mening kanallarim"dagi hali ID'siz yozuvni (@nom bilan qo'shilgan) shu kanalga bog'lash */
function mineLink(ch){
  if(!ch||!ch.id||isMine(ch.id)) return;
  const m=S.mine.find(x=>!x.id&&ch.handle&&normRef(x.ref)===normRef(ch.handle));
  if(m){ Object.assign(m,mineData(ch,m.ref),{err:false}); mineDedupe(); saveMine(); }
}

  hl(){ return this.lang.value||'en'; },
  async ideas(q){
    q=(q||'').trim();
    if(!q){ this.ideaChips.replaceChildren(h('span',{class:'hint',text:"Yozishni boshlang — takliflar shu yerda chiqadi."})); return; }
    const list=await suggest(q,this.hl());
    if(this.inp.value.trim()!==q) return;
    const chip=s=>h('button',{class:'chip',type:'button',onclick:()=>{ this.inp.value=s; this.ideas(s); },text:s});
    if(list.length){ this.ideaChips.replaceChildren(...list.map(chip)); return; }
    const alt=(this.lastTags||[]).filter(t=>t!==q.toLowerCase()).slice(0,20);
    this.ideaChips.replaceChildren(h('span',{class:'hint',style:'width:100%',text:alt.length?"YouTube takliflari olinmadi — o'rniga oxirgi qidiruvdagi raqiblar teglaridan g'oyalar:":"YouTube takliflari olinmadi. Avval «Qidirish» tugmasini bosing — raqiblar teglaridan g'oyalar shu yerda chiqadi."}),...alt.map(chip));
  },
  async deep(){
    const q=this.inp.value.trim(); if(!q){ this.inp.focus(); return; }
    const hangul=/[ㄱ-힝]/.test(q);
    const suf=hangul?['가','나','다','라','마','바','사','아','자','차','카','타','파','하','추천','방법','후기','브이로그','비용','팁']:'abcdefghijklmnopqrstuvwyz'.split('').concat(['how','why','2026']);
    const pre=hangul?['왜','어떻게']:['how to','best','why'];
    const qs=[...suf.map(s=>q+' '+s),...pre.map(p=>p+' '+q)];
    this.deepBox.hidden=false;
    const counter=h('span',{class:'hint',text:"Qidirilmoqda…"});
    const box=h('div',{class:'chips ideas-deep'});
    this.deepBox.replaceChildren(h('div',{class:'row',style:'justify-content:space-between'},counter,h('button',{class:'btn sec sm',type:'button',onclick:()=>copy([...seen].join('\n'))},icon('copy',15,2),'Hammasini nusxalash')),box);
    const seen=new Set();
    await busy(this.deepBtn,async()=>{
      for(let i=0;i<qs.length;i+=4){
        const res=await Promise.all(qs.slice(i,i+4).map(x=>suggest(x,this.hl())));
        for(const s of res.flat()){ if(!seen.has(s)&&s!==q){ seen.add(s); box.append(h('button',{class:'chip',type:'button',onclick:()=>{ this.inp.value=s; this.ideas(s); window.scrollTo({top:0,behavior:'smooth'}); },text:s})); } }
        counter.textContent=`${seen.size} ta g'oya topildi`;
      }
      if(!seen.size) counter.textContent="G'oyalar topilmadi (internetni tekshiring).";
    });
  },
  run(arg){ this.inp.value=arg; this.ideas(arg); this.search(); },
  async search(fresh){
    const q=this.inp.value.trim();
    if(!q){ setStatus(this.st,'error',"Kalit so'z kiriting."); this.inp.focus(); return; }
    this.out.replaceChildren(skeletonReport());
    await busy(this.btn,()=>withApi(fresh,async()=>{
      try{
        setStatus(this.st,'loading','YouTube\'da qidirilmoqda…');
        const days=+this.period.value;
        const p={part:'snippet',type:'video',q,maxResults:50,order:this.order.value,regionCode:this.region.value,relevanceLanguage:this.lang.value,videoDuration:this.dur.value};
        if(days) p.publishedAfter=new Date(Date.now()-days*864e5).toISOString();
        const sr=await api('search',p,100);
        const ids=(sr.items||[]).map(i=>i.id&&i.id.videoId).filter(Boolean);
        const vids=ids.length?await getVideos(ids):[];
        const chs=await getChannelsMap(vids.map(v=>v.channelId));
        for(const v of vids){ const c=chs[v.channelId]; v.subs=c?c.subs:null; v.chThumb=c?c.thumb:''; }
        setStatus(this.st,null);
        this.render(q,vids,chs);
        cacheNote(this.out,()=>this.search(true));
        pushRecent({type:'keyword',ref:q,title:q,thumb:'',t:Date.now()});
      }catch(e){ this.out.replaceChildren(); errorStatus(this.st,e); }
    }));
  },
  render(q,vids,chs){
    const out=this.out; out.replaceChildren();
    if(!vids.length){ out.append(emptyBox('search','Hech narsa topilmadi',"Davrni kengaytiring, mamlakatni 'Hammasi' qiling yoki boshqa so'z yozing.")); return; }
    enrich(vids);
    for(const v of vids){ v.ratio=v.subs?v.views/v.subs:null; }
    LAST_FEED=vids.slice(0,16);
    const medV=median(vids.map(v=>v.views))||0;
    const small=vids.filter(v=>v.subs!=null&&v.subs<10000), smallShare=small.length/vids.length;
    const big=vids.filter(v=>v.subs!=null&&v.subs>=1e6).length/vids.length;
    const brk=vids.filter(v=>v.ratio!=null&&v.ratio>=1);
    const medAge=median(vids.map(v=>v.age))||0;
    const demand=clamp((Math.log10(Math.max(1,medV))-2)/4,0,1);
    const ease=clamp(smallShare*1.4+brk.length/vids.length*0.8-big*0.5,0,1);
    const fresh=clamp(1-medAge/365,0,1);
    const opp=Math.round(100*(0.4*demand+0.45*ease+0.15*fresh));
    const verdict=opp>=65?['good',"Yaxshi imkoniyat: talab bor va kichik kanallar ham ko'rish olmoqda."]:opp>=45?['warn',"O'rtacha: talab bor, lekin raqobat sezilarli. Mavzuni torroq qiling."]:['bad',"Qiyin: natijalarda asosan katta kanallar yoki talab past."];
    out.append(h('div',{class:'two'},

        h('div',{class:'gauge-wrap'},semiGauge(opp,'/ 100'),
          h('div',{class:'subbars'},subBar('Talab',demand*100,100,`odatda ${compact(medV)} ko'rish`,'var(--d1)'),
            subBar('Kirish osonligi',ease*100,100,`${pct(smallShare,0)} natija kichik kanallardan`,'var(--d4)'),
            subBar('Yangilik',fresh*100,100,`videolar odatda ${Math.round(medAge)} kunlik`,'var(--d2)'))),
        h('div',{class:'tip '+verdict[0]},h('div',{class:'ti'},icon(verdict[0]==='good'?'up':'info',17,2)),h('p',{text:verdict[1]})),
        howTo('Bu baho qanday hisoblanadi?',[

      h('div',{class:'kpis',style:'grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))'},
        kpi("Odatiy ko'rish",compact(medV),`${vids.length} ta natija, median`,{icon:'eye'}),
        kpi('Kichik kanallar',pct(smallShare,0),"10 mingdan kam obunachili kanallar ulushi",{icon:'users'}),

      h('div',{class:'vgrid'},outs.map(v=>videoCard(v,{scoreVal:v.ratio,scoreLabel:"Ko'rish ÷ obunachi",channel:true,list:outs})))));
    // channels, tags
    const byCh={};
    for(const v of vids){ const c=byCh[v.channelId]=byCh[v.channelId]||{id:v.channelId,title:v.channelTitle,subs:v.subs,thumb:v.chThumb,n:0,views:0}; c.n++; c.views+=v.views; }
    const topCh=Object.values(byCh).sort((a,b)=>b.views-a.views).slice(0,8);
    const tags=tagFreq(vids).slice(0,36);
    this.lastTags=tags.map(t=>t[0]);
    out.append(h('div',{class:'two'},
      h('div',{class:'card pad stack'},h('div',null,h('h3',{text:'Bu mavzudagi asosiy kanallar'}),h('p',{text:"Natijalarda eng ko'p ko'rish olgan kanallar"})),
        h('div',{class:'list'},topCh.map(c=>h('div',{class:'li'},avatar(c.thumb,c.title,'sm'),h('div',{class:'tx'},h('b',{text:c.title}),h('small',{text:`${c.subs!=null?compact(c.subs)+' obunachi · ':''}${c.n} ta video · ${compact(c.views)} ko'rish`})),
          h('button',{class:'btn sec sm',type:'button',onclick:()=>go('channel',c.id),text:'Tahlil'}))))),
      h('div',{class:'card pad stack'},h('div',{class:'sec-h'},h('div',null,h('h3',{text:'Raqiblar ishlatgan teglar'}),h('p',{text:"Raqam — nechta videoda uchragan"})),
          tags.length?h('button',{class:'btn sec sm',type:'button',onclick:()=>copy(tags.map(t=>t[0]).join(', '))},icon('copy',15,2),'Nusxalash'):null),
        tags.length?h('div',{class:'chips'},tags.map(([t,n])=>h('span',{class:'chip'},t,h('b',{text:n})))):h('p',{class:'hint',text:'Teglar topilmadi.'}))));
    // title words + durations
    const tw={}; for(const v of vids) for(const w of new Set(words(v.title))) tw[w]=(tw[w]||0)+1;
    const twl=Object.entries(tw).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,24);
    const durs=DUR_B.map(b=>{ const g=vids.filter(v=>v.durSec>=b.a&&v.durSec<=b.b); return {l:b.l,s:b.s+(g.length?' · '+g.length+' ta':''),v:g.length?median(g.map(v=>v.views)):null}; });
    out.append(h('div',{class:'two'},
      h('div',{class:'card pad stack'},h('div',null,h('h3',{text:"Sarlavhalardagi so'zlar"}),h('p',{text:"Top videolar sarlavhalarida ko'p takrorlangan so'zlar"})),
        twl.length?h('div',{class:'chips'},twl.map(([w,n])=>h('span',{class:'chip'},w,h('b',{text:n})))):h('p',{class:'hint',text:"Takrorlangan so'z yo'q."})),
      h('div',{class:'card pad stack'},h('div',null,h('h3',{text:'Qanday uzunlik ishlaydi'}),h('p',{text:"Bu mavzuda uzunlik bo'yicha odatiy ko'rish"})),hbars(durs))));
    // table
    const cols=[
      {k:'title',l:'Video',f:v=>vtCell(v,{channel:true,list:vids})},
      {k:'subs',l:'Obunachi',n:1,f:v=>v.subs==null?'—':compact(v.subs)},
      {k:'views',l:"Ko'rish",n:1,f:v=>full(v.views)},
      {k:'ratio',l:"Ko'rish ÷ obuna",n:1,f:v=>v.ratio==null?'—':scoreChip(v.ratio,"Ko'rish ÷ obunachi")},
      {k:'vpd',l:'Kunlik',n:1,f:v=>compact(v.vpd)},

      {k:'eng',l:'Faollik',n:1,f:v=>pct(v.eng)},
      {k:'durSec',l:'Uzunlik',n:1,f:v=>dur(v.durSec)}];
    const dt=dataTable(cols,vids,{sort:{k:'views',d:'desc'},right:h('button',{class:'btn sec sm',type:'button',onclick:()=>csv('qidiruv_'+safeName(q)+'.csv',
      ['Sarlavha','Havola','Kanal','Obunachi',"Ko'rish","Ko'rish/obuna","Kunlik",'Sana','Faollik %','Uzunlik','Teglar'],
      vids.map(v=>[v.title,'https://youtu.be/'+v.id,v.channelTitle,v.subs,v.views,v.ratio==null?'':v.ratio.toFixed(2),Math.round(v.vpd),d10(v.published),(v.eng*100).toFixed(2),dur(v.durSec),(v.tags||[]).join(' | ')]))},icon('download',15,2),'Excel (CSV)')});
    out.append(h('div',{class:'stack'},secHead('Barcha natijalar',`${vids.length} ta video`),dt.el));
  }

const CMP_COL=['var(--d1)','var(--accent)','var(--d2)','var(--d3)'];
V.compare={
  init(el){
    this.inp=h('input',{class:'inp',id:'cmpInp',placeholder:'@kanal_nomi yoki havola',autocomplete:'off'});
    this.chips=h('div',{class:'chips'});
    this.btn=h('button',{class:'btn',type:'button',onclick:()=>this.compare()},icon('columns',17,2.2),'Solishtirish');
    this.quick=h('div',{class:'chips'});
    el.append(h('div',{class:'card pad stack'},
      h('form',{class:'formbar',onsubmit:e=>{ e.preventDefault(); const v=this.inp.value.trim(); if(v){ addToCompare(v,v); this.inp.value=''; } }},
        h('div',{class:'field grow'},h('label',{for:'cmpInp',text:"Kanal qo'shish (4 tagacha)"}),this.inp),
        h('button',{class:'btn line',type:'submit'},icon('plus',16,2.2),"Qo'shish"),this.btn),
      this.chips,this.quick));
    this.st=statusEl(); this.out=h('div',{class:'stack',style:'gap:22px'});
    el.append(this.st,this.out);
    this.drawChips();
    this.out.append(emptyBox('columns',"Kamida 2 ta kanal qo'shing","Raqiblaringizni (yoki o'z kanalingizni) qo'shing va «Solishtirish» tugmasini bosing. Har bir kanal ≈ 3 birlik oladi."));
  },
  show(){ this.drawChips(); },
  run(a){ if(a==='auto'&&CMP.list.length>=2) this.compare(); },
  drawChips(){
    this.chips.replaceChildren(...(CMP.list.length?CMP.list.map((c,i)=>h('span',{class:'chip',style:'padding-right:5px'},h('span',{class:'dot',style:'background:'+CMP_COL[i]}),c.label,
      h('button',{class:'iconbtn',type:'button',style:'width:22px;height:22px;border:0;background:none','aria-label':'Olib tashlash',onclick:()=>{ CMP.list.splice(i,1); store.set('cmp',CMP.list); this.drawChips(); }},icon('x',13,2.4)))):[h('span',{class:'hint',text:"Hali kanal qo'shilmagan."})]));
    this.btn.disabled=CMP.list.length<2;
    const q=S.saved.filter(s=>!CMP.list.some(c=>c.ref===s.id)).slice(0,8);
    this.quick.replaceChildren(...(q.length?[h('span',{class:'hint',style:'align-self:center',text:'Kuzatuvdan:'}),...q.map(s=>h('button',{class:'chip',type:'button',onclick:()=>{ addToCompare(s.id,s.title); this.drawChips(); }},icon('plus',12,2.4),s.title))]:[]));
  },
  async compare(){
    if(CMP.list.length<2) return;
    this.out.replaceChildren(skeletonReport());
    await busy(this.btn,()=>withApi(this._fresh,async()=>{
      try{
        const reps=[];
        for(let i=0;i<CMP.list.length;i++){
          setStatus(this.st,'loading',`${i+1} / ${CMP.list.length}: ${CMP.list[i].label} tahlil qilinmoqda…`);
          const ch=await resolveChannel(CMP.list[i].ref);
          CMP.list[i]={ref:ch.id,label:ch.title};
          if(reps.some(r=>r.ch.id===ch.id)) continue;
          const vids=await getUploads(ch,50);
          reps.push(channelReport(ch,vids));
        }
        store.set('cmp',CMP.list); this.drawChips();

function localDay(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayUz(s){ const p=String(s).split('-').map(Number); return p[2]+'-'+MON[p[1]-1]; }
function addDays(s,n){ const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function signed(x){ return x==null||!isFinite(x)?'—':(x>0?'+':x<0?'−':'')+compact(Math.abs(x)); }
function dpill(x,suf){ if(x==null||!isFinite(x)) return h('span',{class:'delta flat',text:'—'}); return h('span',{class:'delta '+(x>0?'up':x<0?'down':'flat'),text:signed(x)+(suf?' '+suf:'')}); }
function spanTxt(n){ return n===1?'kecha':n+' kunda'; }

/* --- o'z kanallar tarixi: har kuni bitta yozuv (shu brauzer) + GitHub'dagi kunlik yozuvlar (data/history.json) --- */
function histPut(ch){
  if(!ch||!ch.id) return;
  const all=store.get('mhist',{}), e=all[ch.id]=all[ch.id]||{};
  e[localDay()]=[ch.subs==null?null:ch.subs,ch.views,ch.videoCount,Date.now()];
  const ks=Object.keys(e).sort(); while(ks.length>500) delete e[ks.shift()];
  store.set('mhist',all);
}
let REMOTE=null, remoteP=null;
function remoteHist(){
  if(remoteP) return remoteP;
  remoteP=fetch('data/history.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null)
    .then(j=>{ REMOTE=j&&typeof j==='object'&&j.channels?j:null; return REMOTE; });
  return remoteP;
}
function histDays(id){
  const m=new Map();
  const r=REMOTE&&REMOTE.channels&&REMOTE.channels[id];
  if(r&&r.days) for(const [d,a] of Object.entries(r.days)) if(Array.isArray(a)) m.set(d,{d,subs:a[0],views:a[1],videos:a[2]});
  const l=store.get('mhist',{})[id];
  if(l) for(const [d,a] of Object.entries(l)) m.set(d,{d,subs:a[0],views:a[1],videos:a[2],t:a[3]});
  return [...m.values()].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}
function histAt(days,n){ const lim=localDay(new Date(Date.now()-n*864e5)); let b=null; for(const x of days){ if(x.d<=lim) b=x; else break; } return b; }
/* yangi videolar ko'rishlari tarixi: "yangi video odatdagidan tezmi?" degan savolga haqiqiy javob uchun */
function vhPut(vids,chId){
  const all=store.get('vhist',{}), now=Date.now();
  for(const v of vids){
    if(!(v.age<=21)) continue;
    const e=all[v.id]=all[v.id]||{c:chId,s:v.isShort?1:0,pub:+v.published,p:[]};
    const last=e.p[e.p.length-1];
    if(last&&now-last[0]<30*60e3){ last[0]=now; last[1]=v.views; } else e.p.push([now,v.views]);
    if(e.p.length>60) e.p.splice(1,1);
  }
  for(const [id,e] of Object.entries(all)) if(!e||now-e.pub>40*864e5) delete all[id];
  store.set('vhist',all);
}
function vhMerged(){
  const out={}, loc=store.get('vhist',{}), rem=(REMOTE&&REMOTE.videos)||{};
  for(const src of [rem,loc]) for(const [id,e] of Object.entries(src)){
    if(!e||!Array.isArray(e.p)) continue;
    const o=out[id]=out[id]||{c:e.c,s:e.s,pub:e.pub,p:[]};
    o.p.push(...e.p.filter(x=>Array.isArray(x)&&isFinite(x[0])&&isFinite(x[1])));
  }
  for(const e of Object.values(out)) e.p.sort((a,b)=>a[0]-b[0]);
  return out;
}
function viewsAt(e,ageH){
  const P=e.p.map(([t,v])=>[(t-e.pub)/36e5,v]);
  for(let i=0;i<P.length;i++){ if(Math.abs(P[i][0]-ageH)<=Math.max(1,ageH*0.15)) return P[i][1]; }
  for(let i=1;i<P.length;i++){ const a=P[i-1], b=P[i]; if(a[0]<=ageH&&ageH<=b[0]&&b[0]>a[0]) return a[1]+(b[1]-a[1])*(ageH-a[0])/(b[0]-a[0]); }
  return null;
}
function speedOf(v,chId,VH,nbase){
  const ageH=v.age*24, peers=[];
  for(const [id,e] of Object.entries(VH)){ if(id===v.id||e.c!==chId||!!e.s!==!!v.isShort) continue; const x=viewsAt(e,ageH); if(x!=null) peers.push(x); }
  const own=VH[v.id]; let now=null;
  if(own&&own.p.length>=2){ const b=own.p[own.p.length-1]; for(let i=own.p.length-2;i>=0;i--){ const a=own.p[i]; if(b[0]-a[0]>=45*60e3){ now=(b[1]-a[1])/((b[0]-a[0])/36e5); break; } } }
  if(peers.length>=3){ const ex=median(peers); return {r:v.views/Math.max(1,ex),n:peers.length,real:true,ex,now}; }
  return {r:v.views*Math.pow(30/Math.max(v.age,0.25),AGE_K)/(nbase||1),real:false,now};
}
function speedChip(sp){
  if(!sp||!isFinite(sp.r)) return null;
  const r=sp.r, cls=r>=1.8?'hot':r>=0.8?'':'low';
  const t=(r>=9.95?Math.round(r):r.toFixed(1))+'×';
  return h('span',{class:'score '+cls,title:sp.real?`Oldingi ${sp.n} ta videongiz xuddi shu yoshdagi ko'rishlari bilan solishtirildi (odatda ${compact(sp.ex)})`:"Taxminiy baho — dastur har kuni ochilsa (yoki Telegram hisoboti ulansa), 1–2 haftada aniq solishtirishga o'tadi",
    text:(r>=1.8?'🔥 ':'')+t+(sp.real?'':' ~')});
}
function speedWord(sp){ if(!sp) return ''; return sp.r>=1.8?'odatdagidan tez':sp.r>=0.8?'odatdagidek':'odatdagidan sekin'; }

/* --- kunlik hisobot --- */
const REP={last:store.get('report',null),full:null,running:null};
function repSuggest(c){
  const out=[]; const add=(tone,ic,t,act)=>out.push({tone,ic,t,act});
  for(const v of c.newV){
    const r=v.sp.r;
    if(r>=1.8) add('good','flame',`«${v.title}» odatdagidan ${r.toFixed(1)}× tez ketmoqda.`+(v.isShort?" Shu mavzuda yana 2–3 ta Shorts qiling.":" Undan Shorts kesing va shu mavzuda davomini qiling."),{k:'play',v});
    else if(r<=0.5&&v.age>=2) add('warn','image',`«${v.title}» sekin ketmoqda (${r.toFixed(1)}×). Muqova yoki sarlavhani almashtirib ko'ring — avval «Thumbnail sinovi»da tekshiring.`,{k:'preview',v});
  }
  if(c.lastAge!=null&&c.gap!=null&&c.lastAge>Math.max(7,c.gap*1.8)) add('warn','calendar',`Oxirgi video ${Math.floor(c.lastAge)} kun oldin chiqqan. Odatda har ${Math.max(1,Math.round(c.gap))} kunda yuklaysiz — muntazamlik algoritm uchun muhim.`);
  const bl=c.vids.filter(v=>!v.isShort&&v.age>=3&&v.age<=60&&v.score>=2).sort((a,b)=>b.score-a.score)[0];
  if(bl&&!c.newV.includes(bl)) add('info','film',`Eng yaxshi uzun video: «${bl.title}» (${bl.score.toFixed(1)}×). Undan 2–3 ta Shorts kesib chiqaring.`,{k:'play',v:bl});
  if(c.d1&&c.d1.subs!=null&&c.d1.subs<0) add('warn','users',`Obunachilar ${spanTxt(c.d1.span)} ${compact(-c.d1.subs)} taga kamaydi. Oxirgi videolar mavzusi kanal mavzusidan chetga chiqmadimi — tekshiring.`);
  const byWd=[...Array(7)].map(()=>[]); for(const v of c.vids) if(v.age>=3) byWd[v.wd].push(v.score);
  const meds=byWd.map(a=>a.length>=3?median(a):null), all=median(c.vids.filter(v=>v.age>=3).map(v=>v.score));
  let bw=-1; meds.forEach((m,i)=>{ if(m!=null&&(bw<0||m>meds[bw])) bw=i; });
  if(bw>=0&&all&&meds[bw]/all>=1.3) add('info','clock',`${WDF[bw]} kuni chiqqan videolaringiz odatdagidan ${(meds[bw]/all).toFixed(1)}× ko'proq ko'rilgan.`);
  const cm=store.get('cmtSum',{})[c.ch.id];
  if(cm&&cm.open>0&&Date.now()-cm.t<3*864e5) add('info','comment',`${cm.open} ta izoh javob kutmoqda — javob berish tomoshabinni kanalga bog'laydi.`,{k:'comments',id:c.ch.id});
  return out.slice(0,6);
}
function repChannel(ch,vids,VH){
  const days=histDays(ch.id), cur={subs:ch.subs,views:ch.views,videos:ch.videoCount}, today=localDay();
  const dd=n=>{ const p=histAt(days,n); if(!p) return null; const span=Math.round((Date.parse(today)-Date.parse(p.d))/864e5); if(span<1) return null;
    return {subs:cur.subs!=null&&p.subs!=null?cur.subs-p.subs:null,views:p.views!=null?cur.views-p.views:null,videos:p.videos!=null?cur.videos-p.videos:null,span}; };
  const sorted=[...vids].sort((a,b)=>b.published-a.published);
  const gaps=[]; for(let i=0;i<Math.min(sorted.length-1,15);i++) gaps.push((sorted[i].published-sorted[i+1].published)/864e5);
  const newV=sorted.filter(v=>v.age<=7);
  for(const v of newV) v.sp=speedOf(v,ch.id,VH,vids._nbase);
  const c={ch,vids,days,cur,d1:dd(1),d7:dd(7),d30:dd(30),lastAge:sorted[0]?sorted[0].age:null,gap:median(gaps),newV,lang:vids.length?chLang(vids):''};
  c.sug=repSuggest(c);
  return c;
}
function reportRun(fresh){

async function reportBuild(fresh){
  const onStep=t=>{ try{ REP.step&&REP.step(t); }catch(e){} };
  const q0=quotaGet();
  remoteHist();
  onStep("Kanallaringiz ma'lumoti olinmoqda…");
  await mineRefresh(fresh);
  const own=S.mine.filter(m=>m.id);
  if(!own.length) throw new AppErr("«Mening kanallarim» ro'yxatida topilgan kanal yo'q. Sozlamalarda o'z kanalingizni qo'shing.",'nomine');
  const map=await withApi(false,()=>getChannelsMap(own.map(m=>m.id)));
  await remoteHist();
  const VH0=[], chans=[];
  for(let i=0;i<own.length;i++){
    const ch=map[own[i].id]; if(!ch) continue;
    onStep(`Videolar: ${i+1} / ${own.length} — ${ch.title}`);
    let vids=[]; try{ vids=await withApi(fresh,()=>getUploads(ch,30)); }catch(e){ if(fatal(e)) throw e; }

    histPut(ch); vhPut(vids,ch.id); VH0.push([ch,vids]);
  }
  const VH=vhMerged();
  for(const [ch,vids] of VH0) chans.push(repChannel(ch,vids,VH));
  /* raqiblar: «O'xshash kanallar»da 📌 saqlanganlar */
  const rivIds=[...new Set(own.flatMap(m=>simGet(m.id).pins.map(p=>p.id)))].filter(id=>id&&!isMine(id)).slice(0,12);
  let riv=[];
  if(rivIds.length){
    onStep('Saqlangan raqiblar tekshirilmoqda…');
    const rm=await withApi(false,()=>getChannelsMap(rivIds));
    for(const id of rivIds){ const c=rm[id]; if(!c) continue;
      try{ const vs=await withApi(false,()=>getUploads(c,15)); enrich(vs); for(const v of vs){ v.subs=c.subs; v.chThumb=c.thumb; } riv.push(...vs.filter(v=>v.age<=7&&v.age>=0.25&&v.score>=1.5)); }
      catch(e){ if(fatal(e)) throw e; } }
    riv.sort((a,b)=>b.score-a.score); riv=riv.slice(0,8);

  const out={t:Date.now(),chans,riv,rivN:rivIds.length,spent:Math.max(0,quotaGet()-q0),remote:!!REMOTE};
  REP.full=out;
  REP.last={t:out.t,spent:out.spent,chans:chans.map(c=>({id:c.ch.id,title:c.ch.title,thumb:c.ch.thumb,subs:c.ch.subs,d1:c.d1,d7:c.d7,newN:c.newV.length,hot:c.newV.filter(v=>v.sp.r>=1.8).length,
    lastAge:c.lastAge,tip:c.sug[0]?c.sug[0].t:null,tone:c.sug[0]?c.sug[0].tone:null}))};
  store.set('report',REP.last);

}

        const at=f=>{ let b=rows[0]; for(const r of rows) if(r.elapsedVideoTimeRatio<=f) b=r; return b.audienceWatchRatio*100; };
