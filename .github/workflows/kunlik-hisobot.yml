name: Kunlik hisobot

# Hisobot Koreya vaqti bilan har kuni 06:20 da yuboriladi.
# GitHub rejali ishlarni aniq vaqtda emas, ba'zan kechikib ishga tushiradi. Shuning uchun:
#  1) asosiy ish 05:23 (Koreya) da boshlanadi va 06:20 gacha kutib, keyin yuboradi;
#  2) zaxira ish 06:40 da — agar asosiysi umuman kelmagan bo'lsa (yuborilgan bo'lsa o'zi o'tkazib yuboradi).
# UTC: 20:23 = 05:23 KST, 21:40 = 06:40 KST.
# Qo'lda ishga tushirish: Actions → «Kunlik hisobot» → Run workflow (kutmasdan darrov yuboradi).
on:
  schedule:
    - cron: '23 20 * * *'
    - cron: '40 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kunlik-hisobot
  cancel-in-progress: false

jobs:
  hisobot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kanallarni tekshirish va Telegram'ga yuborish
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SEND_AT: '06:20'
        run: node youtube-tahlil/scripts/kunlik-hisobot.mjs

      - name: Tarixni saqlash (dastur grafiklari uchun)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-tahlil/data/history.json
          if git diff --cached --quiet; then echo "O'zgarish yo'q"; exit 0; fi
          git commit -m "Kunlik ma'lumot: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
